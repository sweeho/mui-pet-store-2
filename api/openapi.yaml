# EXTRACTED FROM LEGACY SOURCE — evidence of what exists, not a build target. Where this disagrees with a capability delta spec, the delta spec wins.
# Describes the legacy HTTP/XML surface read from web.xml, mappings.xml and requestmappings.xml. The storefront is HTML (form posts, not JSON);
# response bodies are summarised. The OPC, supplier and admin endpoints are internal and exchange XML documents. Everything else in the legacy
# system (JMS queues, EJB facades) has no HTTP form and is not listed.
openapi: 3.0.3
info:
  title: Java Pet Store 1.3.2 (legacy surface)
  version: 1.3.2
paths:
  /main:
    get: { summary: Storefront home screen, tags: [catalog-browsing], responses: { '200': { description: HTML screen } } }
  /category:
    get: { summary: Category screen (paged products), tags: [catalog-browsing], responses: { '200': { description: HTML screen } } }
  /product:
    get: { summary: Product screen (paged items), tags: [catalog-browsing], responses: { '200': { description: HTML screen } } }
  /productdetails:
    get: { summary: Item detail screen, tags: [catalog-browsing], responses: { '200': { description: HTML screen } } }
  /search:
    get: { summary: Keyword item search, tags: [catalog-browsing], parameters: [{ name: keywords, in: query, schema: { type: string } }], responses: { '200': { description: HTML screen } } }
  /language:
    get: { summary: Change session locale, tags: [localization], responses: { '200': { description: HTML screen } } }
  /changelocale.do:
    get: { summary: Set locale (form field locale, e.g. en_US), tags: [localization], parameters: [{ name: locale, in: query, schema: { type: string } }], responses: { '200': { description: Redirect to client-state page } } }
  /cart.do:
    post: { summary: Add, remove or update cart items, tags: [shopping-cart], responses: { '200': { description: Cart screen } } }
  /checkout:
    get: { summary: Checkout screen, tags: [checkout-order-placement], responses: { '200': { description: HTML screen } } }
  /entershippingaddress:
    post: { summary: Enter shipping address (sign-in required), tags: [checkout-order-placement], responses: { '200': { description: HTML screen } } }
  /validateshippinginformation:
    post: { summary: Validate shipping data (sign-in required), tags: [checkout-order-placement], responses: { '200': { description: HTML screen } } }
  /validatebillinginformation:
    post: { summary: Validate card and billing data (sign-in required), tags: [checkout-order-placement], responses: { '200': { description: HTML screen } } }
  /placeorder:
    post: { summary: Review and place order (sign-in required), tags: [checkout-order-placement], responses: { '200': { description: HTML screen } } }
  /order.do:
    post: { summary: Submit the order to the Order Processing Center, tags: [checkout-order-placement], responses: { '200': { description: Order complete screen }, default: { description: cart_empty_order_error or error screen } } }
  /signin:
    get: { summary: Sign-in screen (sign-in required filter), tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /verifysignin:
    post: { summary: Verify user name and password, tags: [customer-accounts], requestBody: { content: { application/x-www-form-urlencoded: { schema: { type: object, properties: { j_username: { type: string }, j_password: { type: string } } } } } }, responses: { '200': { description: Sign-on result screen } } }
  /signout:
    get: { summary: Sign off and discard session, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /signoff.do:
    get: { summary: Sign off action, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /createnewaccount:
    get: { summary: New account form, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /validatenewaccount:
    post: { summary: Create account; duplicate user name shows duplicate_account screen, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /createuser.do:
    post: { summary: Create sign-on user, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /createcustomer.do:
    post: { summary: Create customer, account and profile, tags: [customer-accounts], responses: { '200': { description: Main screen } } }
  /customer.do:
    post: { summary: Customer profile update, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /editaccount:
    get: { summary: Edit account (sign-in required), tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /updateaccount:
    post: { summary: Save account changes, tags: [customer-accounts], responses: { '200': { description: HTML screen } } }
  /Populate:
    get: { summary: Populate catalog or inventory data (petstore and supplier modules), tags: [batch-operations], responses: { '200': { description: Text status } } }
  /AdminRequestProcessor:
    post: { summary: Admin client request (XML) - list orders by status, approve or deny, sales charts, tags: [order-administration, order-approval], requestBody: { content: { application/xml: { schema: { type: string } } } }, responses: { '200': { description: XML response, content: { application/xml: { schema: { type: string } } } } } }
  /ApplRequestProcessor:
    post: { summary: Admin web application launch and logout, tags: [order-administration], responses: { '200': { description: HTML or JNLP } } }
  /RcvrRequestProcessor:
    post: { summary: Supplier receiver for SupplierOrder XML documents over HTTP, tags: [supplier-fulfillment], requestBody: { content: { application/xml: { schema: { type: string } } } }, responses: { '200': { description: Accepted } } }
components: {}

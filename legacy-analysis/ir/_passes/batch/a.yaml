  - record_key: BATCH-REQ-0015
    kind: requirement
    capability_key: batch-operations
    requirement: The system SHALL notify the responsible mailbox when a job fails or finds data problems - backup failure to operations (urgent), extract failure to Finance, aging report warning to operations, catalog check failure to the catalog team (urgent), and health check failure to operations.
    confidence: high
    confidence_basis: Control-M ON/DOMAIL elements and runbook agree; inventory report and purge have no notification defined.
    risk_class: operational
    basis: DOMAIL actions in the job definitions.
    plain_text: When a nightly job fails or finds a problem, the right team is e-mailed. The low-stock report and the weekly purge send no alert.
    technical_note: Control-M DOMAIL; aging notifies only on COMPSTAT=4, not on exit 8.
    interface: true
    traces:

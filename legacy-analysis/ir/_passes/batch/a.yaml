        line_start: 52
        line_end: 54
        excerpt: |
          <ON STMT="*" CODE="COMPSTAT=4">
            <DOMAIL URGENCY="R" DEST="ps-ops@example.invalid" SUBJECT="Petstore stuck orders found" MESSAGE="See /var/petstore/extract/order_aging_YYYYMMDD.txt" />
          </ON>
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 87
        line_end: 89
        excerpt: |
          <ON STMT="*" CODE="COMPSTAT=4">
            <DOMAIL URGENCY="U" DEST="ps-catalog@example.invalid" SUBJECT="Petstore catalog integrity check failed" MESSAGE="See /var/petstore/log/catalog_check.log" />
          </ON>
    stack_metadata:
      batch.trigger: Control-M ON/DOMAIL

suspected_defects:
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0005]
    severity: low
    category: contradicts-document
    title: Aging report header comment names the wrong statuses
    description: >
      The script comment says it lists orders "not COMPLETED or DENIED after 24 hours", which would include APPROVED and PENDING only by exclusion; the SQL, scheduler and runbook all say PENDING or APPROVED. Behaviour is identical today; the comment is misleading.
    traces:
      - path: legacy-source/batch/ps_order_aging_report.sh
        line_start: 3
        line_end: 3
        excerpt: |
          # Lists orders not COMPLETED or DENIED after 24 hours (stuck in the OPC flow)
      - path: legacy-source/db/batch/order_aging.sql
        line_start: 6
        line_end: 6
        excerpt: |
           WHERE m.status IN ('PENDING', 'APPROVED') AND p.po_date < :CUTOFF_MS
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0008, BATCH-REQ-0015]
    severity: high
    category: other
    title: Purge and inventory report failures raise no alert; purge not idempotent on partial inputs
    description: >
      PS_ORDER_PURGE and PS_INVENTORY_REPORT have no ON/DOMAIL block, and the aging report mails only on code 4, not 8. A failed purge or report is only visible in batch.log. Separately, the purge selects orders by an inner join to contact_info, so an order with no contact row is never purged, and address and card are deleted by id with no check that other orders do not share them.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 68
        line_end: 77
        excerpt: |
          <JOB JOBISN="5" APPLICATION="PETSTORE" SUB_APPLICATION="ORDERS" JOBNAME="PS_ORDER_PURGE"
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 11
        line_end: 14
        excerpt: |
            SELECT p.po_id, p.contact_id, p.card_id, c.address_id
              FROM purchase_order p
              JOIN order_manager m ON m.order_id = p.po_id
              JOIN contact_info c ON c.contact_id = p.contact_id
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0012, BATCH-REQ-0011]
    severity: medium
    category: contradicts-document
    title: Default host name in batch settings differs from the runbook
    description: >
      env.sh defaults the module URLs to host psl-app01; the runbook, the populate URL and the scheduler node use ps-app01. Unless PS_*_URL is overridden in the environment, the health check and first-load calls address a different host from the documented one.
    traces:
      - path: legacy-source/conf/env.sh
        line_start: 10
        line_end: 10
        excerpt: |
          PS_STORE_URL=${PS_STORE_URL:-http://psl-app01:8000/petstore}
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 / 3.6 PS_CATALOG_CHECK
        excerpt: |
          calls http://ps-app01:8000/petstore/Populate?forcefully=false
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0010]
    severity: low
    category: other
    title: Catalog check C4 comment lists locales but query uses category_details
    description: >
      The comment says C4 covers en_US, ja_JP, zh_CN, but the query compares item_details against whatever locales exist in category_details; a locale missing from category_details is silently not checked.
    traces:
      - path: legacy-source/db/batch/catalog_check.sql
        line_start: 11
        line_end: 14
        excerpt: |
          -- C4: items missing a description for a locale the store serves (en_US, ja_JP, zh_CN)
          SELECT 'C4' AS chk, i.itemid, l.locale FROM item i, category_details l
           WHERE l.catid = (SELECT p.catid FROM product p WHERE p.productid = i.productid)
             AND NOT EXISTS (SELECT 1 FROM item_details d WHERE d.itemid = i.itemid AND d.locale = l.locale);
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0001]
    severity: medium
    category: data-corruption
    title: Backup deletes the previous undated backup folder and same-day backup before the new one is verified
    description: >
      The script removes any existing dated folder for today before moving the new backup into place; if the move fails after the old one is removed, no backup exists for the day. The failure branch of the backup call also leaves the stale name unrenamed.
    traces:
      - path: legacy-source/batch/ps_db_backup.sh
        line_start: 9
        line_end: 10
        excerpt: |
          rm -rf "$PS_BACKUP_DIR/PetStoreDB_$STAMP"
          mv "$PS_BACKUP_DIR/PetStoreDB" "$PS_BACKUP_DIR/PetStoreDB_$STAMP"


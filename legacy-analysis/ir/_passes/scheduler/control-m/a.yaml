   "capability_key": "batch-operations",
   "requirement": "The system SHALL run a nightly batch chain in which the database backup starts at 01:00 every day, the order extract starts no earlier than 01:30 and only after the backup has succeeded, and the aging report, inventory report and purge each start only after the order extract has succeeded.",

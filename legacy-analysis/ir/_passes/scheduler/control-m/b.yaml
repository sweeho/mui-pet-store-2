   "capability_key": "batch-operations",
   "requirement": "The system SHALL run the nightly batch chain in this order: database backup at 01:00, order extract at 01:30 (only after the backup succeeded), then order aging report at 01:45, inventory report at 01:50 and order purge at 02:00 (each only after the order extract succeeded).",
   "plain_text": "Every night the database is backed up first; the finance order export runs only after the backup has worked; the stuck-order report, low-stock report and old-order clean-up run only after the export has worked.",
   "technical_note": "Control-M folder PS_PETSTORE_DAILY; ordering via INCOND/OUTCOND conditions PS_DB_BACKUP-OK and PS_ORDER_EXTRACT-OK (ODAT). Extract deletes PS_DB_BACKUP-OK on start (SIGN=-), so it is consumed once per day.",

records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: "The system SHALL store catalog data as categories, products within a category, and items within a product, each identified by a unique code of up to 10 characters, with localized details keyed by (code, locale)."
    confidence: high
    confidence_basis: "Primary and foreign keys declared across five tables plus details tables; constraint-enforced by the database."
    risk_class: operational
    basis: "Tables category, product, item and *_details; FKs fk_product_1, fk_item_1, fk_*_details_1."
    plain_text: "Products and items are organised under categories, and each has a descriptive record per language."
    technical_note: "Tables category, product, item and *_details; FKs fk_product_1, fk_item_1, fk_*_details_1."
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: category
        line_start: 13
        line_end: 15
        excerpt: |
          CREATE TABLE category (
            catid varchar2(10) not null,
            constraint pk_category primary key (catid));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: category_details
        line_start: 19
        line_end: 26
        excerpt: |
          CREATE TABLE category_details (
            catid varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            locale varchar2(10) not null,
            constraint pk_category_details primary key (catid, locale),
            constraint fk_category_details_1 foreign key (catid) references category (catid));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid varchar2(10) not null,
            catid varchar2(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid varchar2(10) not null,
            locale varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: item
        line_start: 49
        line_end: 53
        excerpt: |
          CREATE TABLE item (
            itemid varchar2(10) not null,
            productid varchar2(10) not null,
            constraint pk_item primary key (itemid),
            constraint fk_item_1 foreign key (productid) references product (productid));
    stack_metadata:
      db.object: "category,category_details,product,product_details,item"
      db.kind: table

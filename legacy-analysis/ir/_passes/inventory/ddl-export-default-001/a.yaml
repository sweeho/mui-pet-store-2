  - record_key: CAT-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: "The system SHALL require each item detail record to have a locale, list price, unit cost, image and description, and permit up to five optional attributes of 80 characters each, with prices held to two decimal places."
    confidence: medium
    confidence_basis: "NOT NULL and decimal(10,2) in one DDL."
    risk_class: financial
    basis: "item_details: listprice/unitcost decimal(10,2) not null; attr1-attr5 nullable."
    plain_text: "Each item must have a price, cost, picture and description per language, and may have up to five extra attributes."
    technical_note: "item_details: listprice/unitcost decimal(10,2) not null; attr1-attr5 nullable."
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
            attr1 varchar2(80),
            attr2 varchar2(80),
            attr3 varchar2(80),
            attr4 varchar2(80),
            attr5 varchar2(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
    stack_metadata:
      db.object: "item_details"
      db.kind: table
  - record_key: ACC-ENT-0004
    kind: entity
    capability_key: customer-accounts
    requirement: "The system SHALL store a customer account as linked to exactly one contact record and one credit card record, with a status, and a customer as linked to one sign-on user, one account and one profile."
    confidence: high
    confidence_basis: "Several mandatory FKs and NOT NULLs enforce linkage."
    risk_class: operational
    basis: "Tables account, contact_info, credit_card, customer; fk_account_1/2, fk_customer_1..3 (signon_user, profile defined elsewhere)."
    plain_text: "A customer account always has contact details, a payment card and a status, and belongs to a signed-on user with a profile."
    technical_note: "Tables account, contact_info, credit_card, customer; fk_account_1/2, fk_customer_1..3 (signon_user, profile defined elsewhere)."
    interface: true
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: address
        line_start: 81
        line_end: 89
        excerpt: |
          CREATE TABLE address (
            address_id varchar2(40) not null,
            street_name1 varchar2(80) not null,
            street_name2 varchar2(80),
            city varchar2(80) not null,
            state varchar2(40) not null,
            zip_code varchar2(20) not null,
            country varchar2(40) not null,
            constraint pk_address primary key (address_id));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: contact_info
        line_start: 93
        line_end: 101
        excerpt: |
          CREATE TABLE contact_info (
            contact_id varchar2(40) not null,
            family_name varchar2(80) not null,
            given_name varchar2(80) not null,
            telephone varchar2(40) not null,
            email varchar2(120) not null,
            address_id varchar2(40) not null,
            constraint pk_contact_info primary key (contact_id),
            constraint fk_contact_info_1 foreign key (address_id) references address (address_id));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: credit_card
        line_start: 105
        line_end: 110
        excerpt: |
          CREATE TABLE credit_card (
            card_id varchar2(40) not null,
            card_number varchar2(40) not null,
            card_type varchar2(40) not null,
            expiry_date varchar2(10) not null,
            constraint pk_credit_card primary key (card_id));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: account
        line_start: 114
        line_end: 121
        excerpt: |
          CREATE TABLE account (
            account_id varchar2(40) not null,
            status varchar2(20) not null,
            contact_id varchar2(40) not null,
            card_id varchar2(40) not null,
            constraint pk_account primary key (account_id),
            constraint fk_account_1 foreign key (contact_id) references contact_info (contact_id),
            constraint fk_account_2 foreign key (card_id) references credit_card (card_id));
      - kind: db_object
        path: petstore_oracle.sql
        anchor: customer
        line_start: 135
        line_end: 142
        excerpt: |
          CREATE TABLE customer (
            user_id varchar2(50) not null,
            account_id varchar2(40) not null,
            profile_id varchar2(40) not null,
            constraint pk_customer primary key (user_id),
            constraint fk_customer_1 foreign key (user_id) references signon_user (username),
            constraint fk_customer_2 foreign key (account_id) references account (account_id),
            constraint fk_customer_3 foreign key (profile_id) references profile (profile_id));
    stack_metadata:
      db.object: "address,contact_info,credit_card,account,customer"
      db.kind: table

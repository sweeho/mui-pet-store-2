records:
  - record_key: CUSTOMER-ACCOUNTS-ENTITY-0001
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL store one sign-on credential per username, with a mandatory username (max 50 chars) as unique key and a mandatory password (max 50 chars).
    confidence: medium
    confidence_basis: One clear place (table constraints); no code or tests were read in this unit. Password stored as plain varchar, no hash seen here.
    risk_class: regulated
    basis: Table signon_user has NOT NULL username and password and primary key on username.
    plain_text: Each customer has a unique user name and a password, both required.
    technical_note: Table signon_user, PK pk_signon_user (username). Password column is varchar2(50), which suggests it may be stored unhashed.
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: signon_user
        line_start: 74
        line_end: 77
        excerpt: |
          CREATE TABLE signon_user (
            username varchar2(50) not null,
            password varchar2(50) not null,
            constraint pk_signon_user primary key (username));
    stack_metadata:
      db.object: signon_user
      db.kind: table
  - record_key: CUSTOMER-ACCOUNTS-ENTITY-0002
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL store one profile per profile identifier, with mandatory preferred language, mandatory my-list preference flag and mandatory banner preference flag, and an optional favorite category.
    confidence: medium
    confidence_basis: One clear place (table constraints); the meaning of the 0/1 flags is inferred from number(1).
    risk_class: presentational
    basis: Table profile NOT NULL columns and PK on profile_id; favorite_category nullable.
    plain_text: Each customer has a profile with a preferred language, whether to show their list and banner, and optionally a favorite category.
    technical_note: Table profile, PK pk_profile (profile_id). preferred_language varchar2(10), favorite_category varchar2(10) nullable, my_list_preference and banner_preference number(1).
    interface: false
    traces:

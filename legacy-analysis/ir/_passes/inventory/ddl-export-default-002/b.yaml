records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL store one sign-on credential per username, with a mandatory username (max 50 chars) as unique key and a mandatory password (max 50 chars).
    confidence: medium
    confidence_basis: One clear place, the table DDL; no code read in this pass. Password storage form (plain or hashed) not visible.
    risk_class: regulated
    basis: signon_user has NOT NULL username/password and primary key on username.
    plain_text: Each customer has a unique user name and must have a password to sign on.
    technical_note: Table signon_user, pk_signon_user on username; password varchar2(50) not null, no indication of hashing.
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: signon_user
        line_start: 74
        line_end: 77
        excerpt: |
          CREATE TABLE signon_user (
            username varchar2(50) not null,
            password varchar2(50) not null,
            constraint pk_signon_user primary key (username));
    stack_metadata:
      db.object: signon_user
      db.kind: table
  - record_key: CUST-ENT-0002
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL keep one profile per profile id holding a mandatory preferred language, an optional favorite category, and mandatory my-list and banner preference flags.
    confidence: medium
    confidence_basis: One clear place, the table DDL; the 1-digit flags are presumed booleans, inferred.
    risk_class: presentational
    basis: profile table NOT NULL columns and primary key; favorite_category nullable.
    plain_text: Each customer has preferences for language, favorite category, showing their list and showing banners; the favorite category is optional.
    technical_note: Table profile, pk on profile_id; number(1) flags my_list_preference, banner_preference; no CHECK limiting values to 0/1.
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: profile
        line_start: 125
        line_end: 131
        excerpt: |
          CREATE TABLE profile (
            profile_id varchar2(40) not null,
            preferred_language varchar2(10) not null,
            favorite_category varchar2(10),
            my_list_preference number(1) not null,
            banner_preference number(1) not null,
            constraint pk_profile primary key (profile_id));
    stack_metadata:
      db.object: profile
      db.kind: table
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout-order-placement
    requirement: The system SHALL record each purchase order with a unique id, user id, e-mail, date, locale and monetary value, and SHALL require it to reference an existing contact and an existing credit card.
    confidence: medium
    confidence_basis: One clear place, the DDL with NOT NULL and foreign keys; referenced tables not in this unit.
    risk_class: financial
    basis: purchase_order all columns not null; FKs to contact_info and credit_card.
    plain_text: Every customer order must record who ordered, when, in which locale, the total value, and be linked to a contact address and a payment card on file.
    technical_note: Table purchase_order; po_date number(19) epoch-style; po_value number(12,2); fk_purchase_order_1 -> contact_info, fk_purchase_order_2 -> credit_card.
    interface: false
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: purchase_order
        line_start: 146
        line_end: 157
        excerpt: |
          constraint pk_purchase_order primary key (po_id),
          constraint fk_purchase_order_1 foreign key (contact_id) references contact_info (contact_id),
          constraint fk_purchase_order_2 foreign key (card_id) references credit_card (card_id));
    stack_metadata:
      db.object: purchase_order
      db.kind: table
      db.reads: contact_info, credit_card
  - record_key: SUP-ENT-0001
    kind: entity
    capability_key: supplier-fulfillment
    requirement: The system SHALL record each supplier order with a unique id, date, mandatory status and a reference to an existing contact.
    confidence: medium
    confidence_basis: One clear place, DDL; status values not constrained so allowed states are not visible.
    risk_class: operational
    basis: supplier_order NOT NULL columns, pk, FK to contact_info.
    plain_text: Orders placed with suppliers have an id, date, status and a supplier contact.
    technical_note: Table supplier_order; po_status varchar2(20) without CHECK; fk_supplier_order_1 -> contact_info.
    interface: true
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: supplier_order
        line_start: 182
        line_end: 188
        excerpt: |
          CREATE TABLE supplier_order (
            po_id varchar2(40) not null,
            po_date number(19) not null,
            po_status varchar2(20) not null,
            contact_id varchar2(40) not null,
    stack_metadata:
      db.object: supplier_order
      db.kind: table
  - record_key: SUP-ENT-0002
    kind: entity
    capability_key: supplier-fulfillment
    requirement: The system SHALL record supplier order lines numbered within their supplier order, each with category, product, item, ordered quantity, unit price and shipped quantity, and SHALL require the parent supplier order to exist.
    confidence: medium
    confidence_basis: One clear place, DDL; no CHECK that shipped does not exceed ordered.
    risk_class: operational
    basis: composite pk (po_id, line_number), FK to supplier_order, all columns not null.
    plain_text: Each supplier order consists of numbered lines saying what and how many were ordered, at what price, and how many have been shipped.
    technical_note: Table supplier_line_item; pk (po_id, line_number); quantity_shipped not null with no default or cap.
    interface: true
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: supplier_line_item
        line_start: 192
        line_end: 202
        excerpt: |
          quantity integer not null,
          unit_price number(12,2) not null,
          quantity_shipped integer not null,
          constraint pk_supplier_line_item primary key (po_id, line_number),
          constraint fk_supplier_line_item_1 foreign key (po_id) references supplier_order (po_id));
    stack_metadata:
      db.object: supplier_line_item
      db.kind: table
  - record_key: APPR-REQ-0001
    kind: requirement
    capability_key: order-approval
    requirement: The system SHALL expose, for each purchase order that has an order-manager entry, its id, user, date, value and current approval status.
    confidence: medium
    confidence_basis: One clear place, the view; inner join means orders without a manager row are omitted. order_manager not defined in this unit.
    risk_class: operational
    basis: View joins purchase_order to order_manager on order id.
    plain_text: Order status reports show each order with its customer, date, value and current status; orders with no status record do not appear.
    technical_note: View v_order_status, inner JOIN order_manager m ON m.order_id = p.po_id; no filter.
    interface: true
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: v_order_status
        line_start: 226
        line_end: 228
        excerpt: |
          CREATE VIEW v_order_status AS
            SELECT p.po_id, p.po_user_id, p.po_date, p.po_value, m.status
            FROM purchase_order p JOIN order_manager m ON m.order_id = p.po_id;
    stack_metadata:
      db.object: v_order_status
      db.kind: view
      db.reads: purchase_order, order_manager

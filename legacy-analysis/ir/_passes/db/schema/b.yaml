    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL keep supplier orders with status restricted to PENDING or COMPLETED, each with lines mirroring order lines, and SHALL keep one inventory quantity per item that is never negative.
    confidence: high
    confidence_basis: CHECK constraints in DDL and comments.
    risk_class: operational
    basis: ck_supplier_order_status, ck_inventory_qty.
    plain_text: A supplier order is either pending or completed, and the stock of any item can never drop below zero.
    technical_note: supplier_order, supplier_line_item (FK to supplier_order only), inventory(item_id pk, quantity).
    interface: true
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 235
        line_end: 236
        excerpt: |
          ALTER TABLE supplier_order ADD CONSTRAINT ck_supplier_order_status CHECK (po_status in ('PENDING','COMPLETED'));
          ALTER TABLE inventory ADD CONSTRAINT ck_inventory_qty CHECK (quantity >= 0);
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 180
        line_end: 209
        excerpt: |
          CREATE TABLE supplier_order (
          CREATE TABLE supplier_line_item (
          CREATE TABLE inventory (
    stack_metadata:
      db.object: supplier_order, supplier_line_item, inventory
      ejb.bean: SupplierOrderEJB, InventoryEJB
  - record_key: SUPB-ENT-0012
    kind: entity
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL generate order and purchase-order identifiers from named counters stored one row per name with an integer value.
    confidence: medium
    confidence_basis: One DDL place plus comment; generator logic not read in this shard.
    risk_class: operational
    basis: counter table.
    plain_text: Order numbers are produced from a stored running counter per kind of number.
    technical_note: counter(name pk, counter integer) used by UniqueIdGeneratorEJB.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 211
        line_end: 216
        excerpt: |
          -- COUNTER: Named sequence used by UniqueIdGeneratorEJB for order and PO identifiers.
          CREATE TABLE counter (
            name varchar2(40) not null,
            counter integer not null,
    stack_metadata:
      db.object: counter
      ejb.bean: CounterEJB
  - record_key: BATB-BR-0013
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL index purchase orders by user and date and orders by status, to support the batch jobs that filter on them.
    confidence: medium
    confidence_basis: Index DDL with an explanatory comment; the batch SQL was not examined in this shard.
    risk_class: operational
    basis: ix_po_user, ix_po_date, ix_order_manager_status.
    plain_text: Order look-ups by customer, date and status are kept fast for the nightly jobs.
    technical_note: Also ix_product_catid and ix_item_productid on foreign keys.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 218
        line_end: 223
        excerpt: |
          -- Indexes on foreign keys and the columns the batch jobs filter by.
          CREATE INDEX ix_po_user ON purchase_order (po_user_id);
          CREATE INDEX ix_po_date ON purchase_order (po_date);
          CREATE INDEX ix_order_manager_status ON order_manager (status);
    stack_metadata:
      db.object: ix_po_user, ix_po_date, ix_order_manager_status
  - record_key: BATB-BR-0014
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      GIVEN an order is COMPLETED or DENIED and older than 180 days, WHEN the weekly purge runs, THEN the system SHALL delete it with its lines, supplier orders, contact information, addresses and payment cards; PENDING and APPROVED orders SHALL never be purged.
    confidence: medium
    confidence_basis: Stated in the runbook only in this pass; the schema has no ON DELETE CASCADE, so deletion order depends on the batch script (not read here).
    risk_class: regulated
    basis: Runbook section 3.5; the schema's FKs from orders to contact and card require dependents deleted explicitly.
    plain_text: Finished or denied orders older than six months are removed each Sunday together with the related personal and card data; open orders are kept.
    technical_note: PS_ORDER_PURGE; FKs have no cascade rules.
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: "p1, section 3.5 PS_ORDER_PURGE"
        excerpt: |
          Sundays only. Deletes COMPLETED and DENIED orders older than 180 days, with their order lines, supplier orders,
          contact information, addresses and payment cards.
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 155
        line_end: 157
        excerpt: |
          constraint pk_purchase_order primary key (po_id),
          constraint fk_purchase_order_1 foreign key (contact_id) references contact_info (contact_id),
          constraint fk_purchase_order_2 foreign key (card_id) references credit_card (card_id));
    stack_metadata:
      batch.trigger: PS_ORDER_PURGE weekly
  - record_key: LOCB-BR-0015
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL hold localised catalog text keyed by a locale code of at most 10 characters, one row per entity and locale.
    confidence: high
    confidence_basis: Composite primary keys in both DDL variants and admin guide mention of xml:lang.
    risk_class: presentational
    basis: locale column in *_details tables is part of the primary key.
    plain_text: Names, descriptions, images and prices exist per language, one entry per language.
    technical_note: locale part of pk in category_details, product_details, item_details; purchase_order.po_locale also stored.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 25
        line_end: 25
        excerpt: constraint pk_category_details primary key (catid, locale),
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 69
        line_end: 69
        excerpt: constraint pk_item_details primary key (itemid, locale),
    stack_metadata:
      db.object: category_details, product_details, item_details
findings:
  - kind: conflict
    path: legacy-source/db/schema/petstore_oracle.sql
    description: >
      Two schema files describe different platforms (Oracle 19c "reference production" vs Cloudscape/Derby "runtime"); the runbook
      names Cloudscape. Money columns are decimal(12,2) on Oracle and double on Cloudscape, so rounding differs by platform.
      A human must decide which is authoritative.
  - kind: ambiguity
    path: legacy-source/db/schema/petstore_oracle.sql
    description: >
      Schema header says OPC/Supplier tables are created by the J2EE server at deploy time and no DDL ships; this file is a reconstruction,
      so constraints such as CHECKs and the absence of FKs from order_manager/po_line_item to other tables may not reflect the live database.
suspected_defects:
  - capability_key: customer-accounts
    record_keys: [CUSTB-BR-0004]
    severity: high
    category: other
    title: Passwords stored as plain text
    description: Sign-on passwords are stored unhashed in signon_user.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 72
        line_end: 77
  - capability_key: checkout-order-placement
    record_keys: [CHKB-BR-0009]
    severity: high
    category: other
    title: Card numbers stored in clear
    description: Card number is stored unencrypted in credit_card.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 103
        line_end: 110
  - capability_key: checkout-order-placement
    record_keys: [CHKB-ENT-0007]
    severity: medium
    category: inconsistent-rounding
    title: Money stored as double on Cloudscape and decimal on Oracle
    description: po_value and unit_price are double in the Cloudscape DDL but number(12,2) in Oracle, so totals may round differently per platform.
    traces:
      - path: legacy-source/db/schema/petstore_cloudscape.sql
        line_start: 152
        line_end: 152
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 152
        line_end: 152

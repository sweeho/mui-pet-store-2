records:
  - record_key: LOC-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL assign the configured default locale (en_US) to any session that has no locale yet, on the first request handled by the main controller.
    confidence: high
    confidence_basis: >
      Enforced in the controller code and the default is declared in the web deployment descriptor (two places).
    risk_class: presentational
    basis: Controller servlet sets session locale when absent, using the default_locale init parameter.
    plain_text: A visitor who has not picked a language is shown the site in US English.
    technical_note: MainServlet.doProcess sets WebKeys.LOCALE from init-param default_locale (web.xml).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 111
        line_end: 113
        excerpt: |
          if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
              request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 66
        line_end: 69
        excerpt: |
          <init-param>
            <param-name>default_locale</param-name>
            <param-value>en_US</param-value>
          </init-param>
    stack_metadata:
      framework: custom WAF controller servlet
      session.scope: session

  - record_key: LOC-REQ-0002
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL let a user change the session locale by submitting a locale string of the form language_COUNTRY; a locale parameter that cannot be parsed SHALL cause the change to fail with an error.
    confidence: medium
    confidence_basis: One clear place (the change-locale action plus I18nUtil parser); no test or document describing it.
    risk_class: presentational
    basis: ChangeLocaleHTMLAction stores the parsed locale in the session or raises an exception.
    plain_text: Users can switch the site language; an unrecognised language choice is rejected with an error.
    technical_note: >
      ChangeLocaleHTMLAction on changelocale.do. Parser requires an underscore; null or no-underscore returns null; the string "default" maps to the JVM default locale. The sample JSP offers en_US, de_DE, ja_JP, zh_CN.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 73
        line_end: 83
        excerpt: |
          String localeString = request.getParameter("locale");
          Locale locale = I18nUtil.getLocaleFromString(localeString);
          HttpSession session = request.getSession();
          if (locale != null) {
              session.setAttribute(LOCALE,locale);
              return new ChangeLocaleEvent(locale);
          } else {
              throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
          }
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 172
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex  == -1) return null;
    stack_metadata:
      framework: custom WAF
      session.scope: session

  - record_key: LOC-BR-0003
    kind: business-rule
    capability_key: localization
    requirement: >
      GIVEN a screen request, WHEN a locale request parameter is present, THEN the system SHALL use it in preference to the session locale; WHEN the chosen locale has no loaded screen definitions, THEN the system SHALL fall back to the default locale; WHEN the screen is missing from the chosen locale's definitions, THEN the system SHALL load it from the default locale's definitions.
    confidence: medium
    confidence_basis: One clear place (template servlet); only en_US is configured in the descriptor so the fallback is the only path exercised by the configuration seen.
    risk_class: presentational
    basis: Locale resolution order in TemplateServlet.process.
    plain_text: A language chosen in the link beats the saved language; if no pages exist in that language the English pages are shown.
    technical_note: >
      web.xml configures locales=en_US only, while requestmappings.xml references a ja_JP definition file (screendefinitions_en_US.xml is the only one under WEB-INF in this module), so non-English falls back to en_US here.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 157
        line_end: 166
        excerpt: |
          String languageParam = request.getParameter("locale");
          if (languageParam != null) {
              localeString = languageParam;
          } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {
              localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();
          }
          if (allScreens.get(localeString) == null) {
             localeString = defaultLocale;
          }
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 236
        line_end: 241
        excerpt: |
          if (screen == null) {
              System.err.println("Screen not Found loading default from " + defaultLocale);
              localeScreens = (Screens)allScreens.get(defaultLocale);
              screen = (Screen)localeScreens.getScreen(screenName);
          }
    stack_metadata:
      framework: custom WAF template servlet


records:
  - record_key: LOC-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL change the visitor's session language to the locale named in the "locale" request parameter when that value can be parsed as a language_country code, and SHALL refuse the change with an error when it cannot.
    confidence: medium
    confidence_basis: >
      One clear place (the change-locale action) plus the demo page that offers the allowed values; no test or comment states the rule.
    risk_class: presentational
    basis: >
      ChangeLocaleHTMLAction reads the locale parameter, parses it and either stores it in the session or throws.
    plain_text: >
      A visitor can switch the site language. If the chosen language code is not valid, the switch is refused with an error.
    technical_note: >
      ChangeLocaleHTMLAction.perform stores the Locale in the session under WebKeys.LOCALE and returns a ChangeLocaleEvent; a null locale throws HTMLActionException. Mapped to changelocale.do in mappings.xml.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 73
        line_end: 83
        excerpt: |
          String localeString = request.getParameter("locale");
          Locale locale = I18nUtil.getLocaleFromString(localeString);
          //MessageResources messages = getResources();
          HttpSession session = request.getSession();

          if (locale != null) {
              session.setAttribute(LOCALE,locale);
              return new ChangeLocaleEvent(locale);
          } else {
              throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 50
        excerpt: |
          <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
              <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
          </url-mapping>
    stack_metadata:
      framework: WAF (Sun Blueprints web application framework)
      session.scope: session attribute com.sun.j2ee.blueprints.waf.LOCALE
  - record_key: LOC-BR-0002
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL parse a locale code as language_country (underscore separated), SHALL accept the literal "default" (any case) as the platform default locale, and SHALL treat a null value or a value with no underscore as invalid.
    confidence: medium
    confidence_basis: >
      One clear place (I18nUtil.getLocaleFromString); the variant branch is dead code so only language and country behaviour is certain.
    risk_class: presentational
    basis: >
      I18nUtil.getLocaleFromString.
    plain_text: >
      Language codes are written like "en_US" or "ja_JP". Anything that does not look like that is rejected.
    technical_note: >
      variantIndex is initialised to -1 and never reassigned, so a variant part is never produced (see suspected defect). The country is everything after the first underscore.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 194
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex  == -1) return null;
    stack_metadata:
      framework: WAF
  - record_key: LOC-BR-0003
    kind: business-rule
    capability_key: localization
    requirement: >
      GIVEN a request with no locale stored in the session, WHEN the controller handles it, THEN the system SHALL set the session locale to the configured default locale (en_US).
    confidence: high
    confidence_basis: >
      Code in MainServlet plus the default_locale init parameter in web.xml.
    risk_class: presentational
    basis: >
      MainServlet.doProcess and the default_locale init-param.
    plain_text: >
      A visitor who has not chosen a language is shown the site in US English.
    technical_note: >
      MainServlet reads default_locale at init, and sets WebKeys.LOCALE in the session on every request where it is missing.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 110
        line_end: 113
        excerpt: |
          // set the locale of the user to default if not set
          if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
              request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 58
        line_end: 59
        excerpt: |
          <param-name>default_locale</param-name>
          <param-value>en_US</param-value>
    stack_metadata:
      framework: WAF
      session.scope: session
  - record_key: LOC-BR-0004
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL choose the screen locale from the "locale" request parameter if present, else from the session locale, and SHALL fall back to the default locale when no screen definitions are loaded for the chosen locale; a screen missing from the locale-specific definitions SHALL be taken from the default-locale definitions.
    confidence: high
    confidence_basis: >
      Explicit code with comments in TemplateServlet, in two separate fallback places.
    risk_class: presentational
    basis: >
      TemplateServlet.process.
    plain_text: >
      Pages appear in the language requested in the link, otherwise the visitor's chosen language, and otherwise in the default language. Any page not translated is shown in the default language.
    technical_note: >
      Screen definitions per locale are loaded at init from /WEB-INF/screendefinitions_<locale>.xml for locales listed in the "locales" init-param (only en_US configured). If even the default locale lacks the screen, localeScreens may be the default Screens object; if that is absent a NullPointerException is possible.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 157
        line_end: 166
        excerpt: |
          String languageParam = request.getParameter("locale");
          // The language when specified as a parameter overrides the language set in the session
          if (languageParam != null) {
              localeString = languageParam;
          } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {
              localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();
          }
          if (allScreens.get(localeString) == null) {
             localeString = defaultLocale;
          }
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 236
        line_end: 241
        excerpt: |
          // default to the default locale screen if it was not defined in the locale specific definitions
          if (screen == null) {
              System.err.println("Screen not Found loading default from " + defaultLocale);
              localeScreens = (Screens)allScreens.get(defaultLocale);
              screen = (Screen)localeScreens.getScreen(screenName);
          }
    stack_metadata:
      framework: WAF TemplateServlet
      session.scope: session
  - record_key: LOC-REQ-0005
    kind: screen
    capability_key: localization
    requirement: >
      The system SHALL offer a locale selection form with the choices US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN) that submits the selected code as "locale".
    confidence: medium
    confidence_basis: >
      One place, a framework demo JSP; it is not clear that the production store uses it. de_DE is offered although no German screen definitions are configured.
    risk_class: presentational
    basis: >
      changelocale.jsp, a framework demonstration page ("This page demonstrates a standard action in the WAF").
    plain_text: >
      The site offers a language choice of English, German, Japanese and Chinese.
    technical_note: >
      Form posts to changelocale.do. web.xml "locales" lists only en_US, so de_DE has no definitions and falls back to default.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/docroot/changelocale.jsp
        line_start: 44
        line_end: 61
        excerpt: |
          <form action="changelocale.do">
           Set Locale to:
           <select name="locale">
            <option value="en_US">US English</option>
            <option value="de_DE">German</option>
            <option value="ja_JP">Japanese</option>
            <option value="zh_CN">Simplified Chinese</option>
           </select>
    stack_metadata:
      jsp.page: changelocale.jsp
  - record_key: LOC-REQ-0006
    kind: workflow
    capability_key: localization
    requirement: >
      The system SHALL, after a locale change, record the locale as the "locale" attribute of the user's server-side controller state and SHALL display the locale-change success screen.
    confidence: medium
    confidence_basis: >
      Code is clear but the controller attribute is only written, never read within this module; success screen exists in screendefinitions_en_US.xml.
    risk_class: operational
    basis: >
      ChangeLocaleEJBAction and the url-mapping screen.
    plain_text: >
      After switching language the visitor sees a confirmation page.
    technical_note: >
      ChangeLocaleEJBAction sets machine attribute "locale". See suspected defect: the event mapping names a class that does not exist, so this action is not invoked.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/action/actions/ChangeLocaleEJBAction.java
        line_start: 52
        line_end: 56
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              ChangeLocaleEvent ce = (ChangeLocaleEvent)e;
              machine.setAttribute("locale", ce.getLocale());
              return null;
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/screendefinitions_en_US.xml
        line_start: 65
        line_end: 65
        excerpt: |
          <screen name="locale_change_success">
    stack_metadata:
      ejb.bean: EJBControllerLocal
  - record_key: LOC-REQ-0007
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL allow a URL mapping to be marked as requiring sign-in, and SHALL select the application's sign-in and sign-in-error screens from the request mappings configuration.
    confidence: low
    confidence_basis: >
      Declared in the framework's sample requestmappings.xml only; enforcement code was not read in this module and the file's use by MainServlet (which loads mappings.xml) is not shown. Filed under customer-accounts as the closest listed capability.
    risk_class: regulated
    basis: >
      requestmappings.xml declares signin-screen, signin-error-screen and requiresSignin="true" for /editaccount and /signin.
    plain_text: >
      Some pages, such as editing an account, require the visitor to be signed in first.
    technical_note: >
      requestmappings.xml appears to be a petstore-style file left in the framework; no WAF code reads requiresSignin in this module. Reachability unresolved.
    interface: false
    dispute:
      reason: unresolved-reachability
      detail: >
        requestmappings.xml is not loaded by MainServlet (it loads /WEB-INF/mappings.xml). Settling it requires finding the consumer in the petstore module.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/xml/requestmappings.xml
        line_start: 46
        line_end: 59
        excerpt: |
          <signin-screen>SIGN_IN</signin-screen>
          <signin-error-screen>SIGN_IN_ERROR</signin-error-screen>
          <url-mapping url="/editaccount" screen="EDIT_ACCOUNT" requiresSignin="true"/>
          <url-mapping url="/signin" screen="SIGN_IN_SUCCESS" requiresSignin="true"/>
    stack_metadata:
      framework: WAF
  - record_key: LOC-REQ-0008
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL route an unhandled error to the screen mapped to the closest matching exception type, and SHALL fail with a server error when no mapping matches.
    confidence: medium
    confidence_basis: >
      One clear implementation (MainServlet plus ScreenFlowManager.getExceptionScreen); no test.
    risk_class: operational
    basis: >
      MainServlet.doProcess catch block.
    plain_text: >
      When something goes wrong, the visitor is shown an error page if one is defined for that kind of error; otherwise a generic server failure occurs.
    technical_note: >
      Exception mappings come from mappings.xml. The only mapping targets a petstore GeneralFailureException class, not the WAF one.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 117
        line_end: 127
        excerpt: |
          } catch (Throwable ex) {
              String className = ex.getClass().getName();
              String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
              // put the exception in the request
              request.setAttribute("javax.servlet.jsp.jspException", ex);
              if (nextScreen == null) {
                  // send to general error screen
                  ex.printStackTrace();
                  throw new ServletException("MainServlet: unknown exception: " + className);
              }
    stack_metadata:
      framework: WAF

          private String getKey() {
                  HttpServletRequest req =
                  ((HttpServletRequest) pageContext.getRequest());
                  return  (req.getRequestURL().toString()
                                  + '#' + name
                                  + '?' + req.getQueryString());
          }
      - path: legacy-source/app/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java

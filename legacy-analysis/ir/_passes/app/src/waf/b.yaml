  - record_key: LOC-BR-0010
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL cache rendered page fragments for a configured duration, keyed by request URL, fragment name and query string, in the chosen scope (page, request, session or application), and SHALL re-render the fragment once its age exceeds the duration.
    confidence: medium
    confidence_basis: >
      One clear implementation (CacheTag) with a demo page; the duration units (milliseconds) are inferred from the code. Filed under catalog-browsing as the nearest listed capability; the module is generic.
    risk_class: presentational
    basis: >
      CacheTag.
    plain_text: >
      Parts of a page can be remembered for a set time so they are not rebuilt on every view.
    technical_note: >
      Key does not include locale, so a cached fragment in a shared scope is reused across locales unless the query string differs.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java
        line_start: 74
        line_end: 80

  - record_key: LOC-REQ-0011
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL render a screen by looking up its definition by the URL name and inserting its template, and SHALL print a "Definition for screen ... not found" message when no definition exists in any locale.
    confidence: medium
    confidence_basis: >
      One implementation in TemplateServlet; behaviour for the PREVIOUS screen also visible there.
    risk_class: presentational
    basis: >
      TemplateServlet.process.
    plain_text: >
      Each page is assembled from a named layout; a missing page definition shows a plain error message.
    technical_note: >
      A request named PREVIOUS re-renders the last screen stored in the session; previous parameters/attributes are restored only when the init-params cache_previous_screen_* are true (attributes false in web.xml).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 242
        line_end: 252
        excerpt: |
          if (screen != null) {
              request.setAttribute(WebKeys.CURRENT_SCREEN, screen);
              String templateName = localeScreens.getTemplate(screenName);
              if (templateName != null) {
                  insertTemplate(request, response, templateName);
              }
          } else {
              response.setContentType("text/html;charset=8859_1");
              PrintWriter out = response.getWriter();
              out.println("<font size=+4>Error:</font><br>Definition for screen " + screenName + " not found");
          }
    stack_metadata:
      framework: WAF TemplateServlet
      ejb.transaction: UserTransaction around forward, recoverable if unavailable

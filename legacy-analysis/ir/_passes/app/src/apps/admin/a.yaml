suspected_defects:
  - capability_key: order-administration
    record_keys: [ORDER-ADMIN-REQ-0004, ORDER-ADMIN-REQ-0007]
    severity: medium
    category: error-swallowed
    title: Failed order and chart queries return null (empty response)
    description: >
      When the OPC call fails, getOrders and getChartInfo print the stack trace and return null, so the client gets an empty body rather than an error message.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 184
        line_end: 187
  - capability_key: order-approval
    record_keys: [ORDER-ADMIN-REQ-0005]
    severity: medium
    category: other
    title: Status update accepts any status and reports success when only queued
    description: >
      The server does not check that the submitted status is APPROVED or DENIED, and returns SUCCESS once the message is queued, so a failed downstream update is not reported. The client-side status check has no effect.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 190
        line_end: 213
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreProxy.java
        line_start: 82
        line_end: 89
  - capability_key: order-administration
    record_keys: [ORDER-ADMIN-REQ-0001]
    severity: high
    category: other
    title: Default admin credentials pre-filled and no TLS required
    description: >
      The login page pre-fills user jps_admin and password admin, and the constraint sets transport guarantee NONE. The data-request servlet is not covered by the security constraint.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 179
        line_end: 185
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 85
        line_end: 87

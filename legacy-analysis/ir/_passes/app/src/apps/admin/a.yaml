  - record_key: ORDER-ADMIN-WF-0003
    kind: workflow
    capability_key: order-administration
    requirement: The system SHALL let an administrator launch the order-management rich client from the admin home page and log out from the same page.
    confidence: medium
    confidence_basis: One servlet dispatch plus index.jsp hidden fields; no second source.
    risk_class: operational
    basis: AdminRequestProcessor.doPost dispatches on currentScreen "manageorders" (builds a launch descriptor carrying server, port and session id) and "logout".
    plain_text: From the admin home page the administrator can open the order management tool or sign out.

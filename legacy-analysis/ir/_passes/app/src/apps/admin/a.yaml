  - record_key: ORDER-ADMIN-REQ-0006
    kind: requirement
    capability_key: order-approval
    requirement: The system SHALL treat orders as pending admin approval only when their total exceeds 500; orders under 500 are approved automatically.
    confidence: medium
    confidence_basis: Stated in the user guide and runbook; the threshold itself is enforced in the OPC, not in this module, so not seen in code here.
    risk_class: financial
    basis: User guide states pending iff total greater than $500; runbook diagram shows PENDING otherwise. Admin module only displays the result.
    plain_text: Orders over $500 wait for an administrator; smaller ones are approved automatically.
    technical_note: Threshold lives in the OPC module; recorded here because it determines what the admin client shows. The user guide says "less than $500" in one place and "greater than $500" in another; exactly 500 is unspecified.
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: "3.3 Approving or denying orders"
        excerpt: |
          An order is pending if its total value is greater than $500.
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: "order flow"
        excerpt: |
          otherwise                              --> PENDING until the Admin client approves or denies
    stack_metadata: {}

  - record_key: ORDER-ADMIN-REQ-0005
    kind: business-rule
    capability_key: order-approval
    requirement: The system SHALL let an administrator change the status of pending orders to APPROVED or DENIED, in batches saved with one commit, and SHALL send the changes asynchronously to the order processing centre as an order-approval message.
    confidence: high
    confidence_basis: Client panel code, server updateOrders and AsyncSender call, and user guide section 3.3 agree.
    risk_class: financial
    basis: OrdersApprovePanel offers Approve/Deny buttons and status dropdown; UPDATESTATUS builds an OrderApproval XML and sends via AsyncSender; response SUCCESS is returned once queued.
    plain_text: The administrator can approve or deny waiting orders, several at once, and save; the decision is passed on to order processing.
    technical_note: Server accepts any OrderStatus string without checking it is APPROVED/DENIED ("assumes values are the same"). Orders with null id or status are silently skipped. SUCCESS only means the message was queued, not that the order changed. Client status check (checkStatus) has an empty body and compares strings by reference.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 186
        line_end: 222
        excerpt: |
          OrderApproval oa = new OrderApproval();
          ...
          oa.addOrder(new ChangedOrder(orderId, orderStatus));
          bd.updateOrders(oa);
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 92
        line_end: 101
        excerpt: |

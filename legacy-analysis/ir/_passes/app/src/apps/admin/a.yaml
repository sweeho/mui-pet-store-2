records:
  - record_key: ORDER-ADMIN-REQ-0001
    kind: requirement
    capability_key: order-administration
    requirement: The system SHALL restrict the admin entry point to authenticated users holding the "administrator" role, using a form-based sign-in.
    confidence: high
    confidence_basis: Declared in web.xml (security-constraint, login-config, security-role) and corroborated by the login page and the rich-client servlet's session check.
    risk_class: regulated
    basis: web.xml constrains the admin servlet to role administrator with FORM login; the client servlet rejects requests without a session.
    plain_text: Only signed-in order administrators can use the admin tool.
    technical_note: web.xml security-constraint on /AdminRequestProcessor (GET, POST), role administrator, FORM login /login.jsp. Transport guarantee NONE (no TLS required). ApplRequestProcessor is NOT in the constraint and relies on a session existing.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 101
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
          <auth-constraint>
            <role-name>administrator</role-name>
    stack_metadata:
      framework: servlet
      session.scope: container session

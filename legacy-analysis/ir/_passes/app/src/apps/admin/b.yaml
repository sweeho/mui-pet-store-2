suspected_defects:
  - capability_key: order-administration
    record_keys: [OADM-REQ-0001, OADM-INT-0001]
    severity: high
    category: other
    title: Data endpoint used by the rich client is not covered by the security constraint
    description: >
      Only /AdminRequestProcessor is protected by the administrator constraint. /ApplRequestProcessor, which lists and approves orders and returns revenue, only checks that a session exists, so any session (not necessarily an administrator's) is accepted.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 99
  - capability_key: order-administration
    record_keys: [OADM-REQ-0001]
    severity: medium
    category: other
    title: Login form is pre-filled with the administrator user id and password
    description: >
      login.jsp ships default values jps_admin / admin in the input fields, and the transport guarantee is NONE (no encryption).
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
  - capability_key: order-approval
    record_keys: [OADM-INT-0002]
    severity: medium
    category: other
    title: Success is reported when the approval message is queued, not applied
    description: >
      updateOrders answers SUCCESS after queuing the message; later failures are invisible to the administrator.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 229
        line_end: 237
  - capability_key: order-administration
    record_keys: [OADM-REQ-0004, OADM-REQ-0007]
    severity: medium
    category: error-swallowed
    title: Backend failures return a null reply
    description: >
      getOrders and getChartInfo catch AdminBDException, print the stack trace and return null, so the client receives an empty body instead of an error; getOrders also returns null when no order set is returned.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 197
        line_end: 200
  - capability_key: order-administration
    record_keys: [OADM-REQ-0007]
    severity: low
    category: inconsistent-rounding
    title: Revenue totalled in single-precision floating point
    description: >
      Revenue amounts are summed as float, so totals can lose precision for money values.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 262
        line_end: 270
  - capability_key: order-administration
    record_keys: [OADM-WF-0001]
    severity: low
    category: other
    title: Logout screen falls through to the manage-orders check
    description: >
      After forwarding to logout the code continues to the next if, and a request without currentScreen returns an empty response.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 109
        line_end: 112
findings: []

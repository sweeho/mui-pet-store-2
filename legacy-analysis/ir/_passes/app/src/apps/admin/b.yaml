    risk_class: operational
    basis: AdminRequestProcessor.doPost and buildJNLP.
    plain_text: From the admin web page the administrator launches the desktop order administration tool, which reuses their signed-in session.
    technical_note: AdminRequestProcessor.buildJNLP emits JNLP with main class PetStoreAdminClient, proxy class HttpPostPetStoreProxy, host, port, session id; content type application/x-java-jnlp-file; a logout screen value forwards to logout.jsp; a missing currentScreen returns nothing.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          String curScreen = req.getParameter("currentScreen");
          if (curScreen == null) { return; }
          ...
          if(curScreen.equals("manageorders")) {
              resp.setContentType("application/x-java-jnlp-file");
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 87
        line_end: 91
        excerpt: |
          jnlp.append("<application-desc main-class=\"com.sun.j2ee.blueprints.admin.client.PetStoreAdminClient\">\n");
          jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
          jnlp.append("<argument>").append(serverName).append("</argument>\n");
          jnlp.append("<argument>").append(serverPort).append("</argument>\n");
          jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
    stack_metadata:
      framework: servlet
      jsp.page: index.jsp
  - record_key: OADM-REQ-0003
    kind: requirement
    capability_key: order-administration
    requirement: The system SHALL answer rich-client requests only when an existing session is present, and otherwise SHALL reply with an error telling the user the session timed out and to log in again as admin.
    confidence: medium
    confidence_basis: One clear check in ApplRequestProcessor; the session is only checked for existence, not role.
    risk_class: regulated
    basis: req.getSession(false) null check.
    plain_text: If the administrator's session has expired, the tool tells them to sign in again instead of showing data.
    technical_note: ApplRequestProcessor.doPost; error is an XML Response/Error element.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 99

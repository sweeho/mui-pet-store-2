records:
  - record_key: OADM-REQ-0001
    kind: requirement
    capability_key: order-administration
    requirement: The system SHALL restrict the admin web entry point to authenticated users holding the administrator role, using a form-based sign-in with a login page and an error page.
    confidence: high
    confidence_basis: Declared in web.xml (constraint, login-config, security-role) and backed by login.jsp posting to the container check; the constraint scope is narrower than the whole module (see defect).
    risk_class: regulated
    basis: web.xml security-constraint on /AdminRequestProcessor for GET and POST with role administrator; FORM login-config.
    plain_text: Only users with the administrator role can open the order administration tool, after signing in through a login form.
    technical_note: web.xml security-constraint MySecureBit0 plus FORM login-config; login.jsp posts j_security_check.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 101
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
          ...
            <auth-constraint>
              <role-name>administrator</role-name>
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 52
        line_end: 52
        excerpt: |
          <form action="j_security_check" method=post>
    stack_metadata:
      framework: servlet
      jsp.page: login.jsp
  - record_key: OADM-REQ-0002
    kind: requirement
    capability_key: order-administration
    requirement: The system SHALL expire an administrator session after 54 minutes of inactivity.
    confidence: low
    confidence_basis: A bare literal in web.xml with no comment or other source; the unusual value 54 suggests it may be arbitrary.
    risk_class: operational
    basis: session-timeout 54 in web.xml; no authoritative source found.
    plain_text: An administrator who is inactive for 54 minutes has to sign in again.
    technical_note: web.xml session-config/session-timeout = 54 (minutes).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      session.scope: http-session
  - record_key: OADM-WF-0001
    kind: workflow
    capability_key: order-administration
    requirement: GIVEN an authenticated administrator posts the manage-orders screen request WHEN the request is processed THEN the system SHALL return a Java Web Start launch descriptor that starts the rich admin client, passing the server name, server port and the session id to it.

  - record_key: OADM-WF-0002
    kind: workflow
    capability_key: order-approval
    requirement: GIVEN an administrator has marked orders as APPROVED or DENIED WHEN they commit THEN the system SHALL send the approved set and the denied set as separate status updates, SHALL ignore the commit if no order is marked, SHALL disable the approve, deny and commit actions while the update runs, and SHALL reload all order data afterwards.
    confidence: high
    confidence_basis: Client commit logic and server update handler read together.
    risk_class: financial
    basis: DataSource.commit and ApplRequestProcessor.updateOrders.
    plain_text: Approvals and denials take effect only when the administrator commits them; the tool then refreshes the order list.
    technical_note: OrdersApproveTableModel.commit calls server.updateStatus twice (APPROVED then DENIED) then getServerOrderData.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
        line_start: 435
        line_end: 474

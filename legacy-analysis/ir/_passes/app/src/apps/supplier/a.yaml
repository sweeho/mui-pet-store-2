  - record_key: SUPPLIER-FULFILLMENT-RULE-0004
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL mark a supplier purchase order COMPLETED only when every one of its lines could be shipped in the current pass; otherwise it SHALL remain pending for later reprocessing.
    confidence: medium
    confidence_basis: One clear place; status values come from a shared names class not read in this module.
    risk_class: operational
    basis: allItemsAvailable is cleared by any unavailable line; status set to COMPLETED only if it stays true. Lines already shipped earlier are skipped without clearing the flag.
    plain_text: A supplier order counts as completed once all its lines have been shipped; until then it stays open and is retried.
    technical_note: processAnOrder sets po status OrderStatusNames.COMPLETED when allItemsAvailable.
    interface: false
    stack_metadata: {ejb.bean: OrderFulfillmentFacadeEJB, db.object: SupplierOrder entity}
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 197
        line_end: 198
        excerpt: |
          if(allItemsAvailable)
            po.setPoStatus(OrderStatusNames.COMPLETED);

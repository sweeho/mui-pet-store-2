records:
  - record_key: SUPPLIER-FULFILLMENT-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL receive each supplier purchase order as an XML message from the purchase-order queue, persist it, and attempt to fulfil it from inventory immediately.
    confidence: high
    confidence_basis: Message-driven bean code, facade code and the operations runbook flow diagram agree.
    risk_class: operational
    basis: The queue listener passes the message text to the fulfilment facade, which parses, persists and processes the order.
    plain_text: When the supplier receives a purchase order from the store, it records the order and tries to ship it from stock straight away.
    technical_note: SupplierOrderMDB.onMessage -> OrderFulfillmentFacadeEJB.processPO (parse via TPASupplierOrderXDE, create SupplierOrder entity, processAnOrder). Queue jms/supplier/PurchaseOrderQueue.
    interface: true
    stack_metadata: {ejb.bean: SupplierOrderMDB, ejb.transaction: Container, jms.queue: jms/supplier/PurchaseOrderQueue}

suspected_defects:
  - capability_key: supplier-fulfillment
    record_keys: [SUPPLIER-FULFILLMENT-WORKFLOW-0007]
    severity: medium
    category: error-swallowed
    title: Inventory update failures are printed and swallowed, with no user feedback
    description: >
      All exceptions in the update-and-reprocess transaction are only printed; the transaction may be left open and the user receives no response or error page. Also non-numeric quantity input throws an unhandled exception.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 208
  - capability_key: supplier-fulfillment
    record_keys: [SUPPLIER-FULFILLMENT-RULE-0005]
    severity: low
    category: error-swallowed
    title: Invoice creation failure is logged and the order stays unfulfilled in the invoice sense but stock was already reduced
    description: >
      If invoice creation fails after stock was reduced and lines marked shipped, null is returned and no invoice is ever sent; the lines are skipped on later passes since quantity equals shipped, so the OPC never learns of the shipment.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 199
        line_end: 208

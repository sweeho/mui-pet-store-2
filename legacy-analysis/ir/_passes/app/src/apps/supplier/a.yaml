  - record_key: SUPPLIER-FULFILLMENT-WORKFLOW-0007
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      WHEN the supplier submits an inventory update THEN the system SHALL, in one transaction, set the new quantities, re-process every pending supplier order, and send the resulting invoices.
    confidence: high
    confidence_basis: Servlet code and the user guide and runbook describe the same behaviour.
    risk_class: operational
    basis: The updateinventory branch begins a user transaction, updates stock, processes pending POs, sends invoices, commits.
    plain_text: When the stock clerk saves new stock levels, the supplier immediately retries all waiting orders and sends invoices for those it can now ship.
    technical_note: RcvrRequestProcessor.doPost, currentScreen=updateinventory, UserTransaction begin/commit; processPendingPO finds orders by PENDING status.
    interface: true
    stack_metadata: {framework: servlet, session.scope: none, ejb.transaction: UserTransaction}
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 179
        line_end: 189
        excerpt: |
          ut.begin();        // start the xaction.
          updateInventory(req);
          Collection invoices = procPO.processPendingPO();
          sendInvoices(invoices);
          ut.commit();        // end xaction
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java

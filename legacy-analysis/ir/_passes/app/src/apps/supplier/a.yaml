  - record_key: SUPPLIER-FULFILLMENT-RULE-0002
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL ship a purchase-order line only when stock for its item is at least the line quantity, in which case it SHALL reduce stock by the line quantity and mark the whole line shipped; lines already fully shipped SHALL be skipped.
    confidence: high
    confidence_basis: Enforced in the facade's line loop and the inventory check, and consistent with the runbook; no partial-shipment path exists.
    risk_class: financial
    basis: Lines are shipped all-or-nothing per line; there is no partial quantity shipped.
    plain_text: An order line is shipped in full only if there is enough stock for the whole line; otherwise it waits. Lines already shipped are not shipped again.
    technical_note: processAnOrder skips lines where quantity == quantityShipped, calls checkInventory (findByPrimaryKey, compare, reduceQuantity) then sets quantityShipped = quantity.
    interface: false
    stack_metadata: {ejb.bean: OrderFulfillmentFacadeEJB, ejb.transaction: Required, db.object: Inventory entity}
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 187
        line_end: 196
        excerpt: |
          if(li.getQuantity() == li.getQuantityShipped())
            continue;
          if(!checkInventory(li)) {
            allItemsAvailable = false;
            continue;
          }
          li.setQuantityShipped(li.getQuantity());
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |

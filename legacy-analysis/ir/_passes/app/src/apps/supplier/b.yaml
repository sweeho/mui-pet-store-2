records:
  - record_key: SF-WF-0001
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL, on receiving a supplier purchase order message, persist the purchase order and then attempt to fulfil it from inventory, returning an invoice document only if at least one line was shipped.
    confidence: high
    confidence_basis: >
      Facade code, the message-driven bean that calls it, and the operations runbook all describe the flow.
    risk_class: operational
    basis: SupplierOrderMDB passes the XML to processPO, which creates the order then calls processAnOrder; a non-null invoice is forwarded, else it waits for inventory.
    plain_text: When the supplier receives a purchase order from the store it records it and ships what it has in stock, then sends an invoice for what was shipped.
    technical_note: SupplierOrderMDB.onMessage -> OrderFulfillmentFacadeEJB.processPO -> processAnOrder; null invoice means wait for stock update.
    interface: true
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: SupplierOrderMDB, OrderFulfillmentFacadeEJB
      ejb.transaction: Container (Required)
      jms.queue: jms/supplier/PurchaseOrderQueue
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 108
        line_end: 113
        excerpt: |
          String invoice = doWork(recdText);
          // If orders were shipped, do the transition
          if(invoice!=null) {
            doTransition(invoice);
          } //else wait for the inventory to arrive at the inventory receiver
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 229
        line_end: 240
        excerpt: |
          order = supplierOrderLocalHome.create(supplierOrder);
          //fullfil order
          invoiceXml = processAnOrder(order);
          return invoiceXml;
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        line_start: 26
        line_end: 27
        excerpt: |
          APPROVED --> Supplier (PurchaseOrderQueue) --> ships from INVENTORY --> InvoiceTopic --> OPC
          OPC marks the order COMPLETED when every line is shipped
  - record_key: SF-BR-0001
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL ship a purchase order line only in full: GIVEN a line whose ordered quantity exceeds the stock on hand, or whose item has no inventory record, WHEN fulfilment is attempted THEN the line SHALL be left unshipped with stock unchanged, and otherwise the full quantity SHALL be deducted from stock and the line marked fully shipped.
    confidence: high
    confidence_basis: Explicit checks in code plus an explanatory comment on the not-found case.
    risk_class: operational
    basis: checkInventory compares stock to the line quantity before reducing; lines already fully shipped are skipped.
    plain_text: A line is shipped only if there is enough stock for the whole quantity; otherwise it waits. Items the supplier has never stocked are also treated as unavailable.
    technical_note: checkInventory in OrderFulfillmentFacadeEJB; FinderException swallowed returns false. No partial shipment of a line.
    interface: false
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB, InventoryEJB
      db.object: inventory
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 127
        line_end: 138
        excerpt: |
          InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
          if(inv.getQuantity() < item.getQuantity())
            return(false);
          inv.reduceQuantity(item.getQuantity());
        } catch (FinderException fe) {
          // swallow the finder exception because this means
          // supplier has not been populated; So we cant fulfill
          // this part of the order now
          return(false);
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 187
        line_end: 195
        excerpt: |
          if(li.getQuantity() == li.getQuantityShipped())
            continue;
          if(!checkInventory(li)) {
            allItemsAvailable = false;
            continue;
          }
          li.setQuantityShipped(li.getQuantity());
  - record_key: SF-BR-0002
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL mark a supplier purchase order COMPLETED only when every line in it was shipped in the current pass; an order with any unshipped line SHALL remain in its prior (pending) status.
    confidence: medium
    confidence_basis: One place in code; the flag is set per pass, so already-shipped lines from earlier passes are skipped without affecting it.
    risk_class: operational
    basis: allItemsAvailable starts true and is cleared by any line failing the stock check.
    plain_text: A purchase order is complete once all of its lines have been shipped; until then it stays pending.
    technical_note: processAnOrder sets po status via OrderStatusNames.COMPLETED. Pending orders are located by findOrdersByStatus(PENDING).
    interface: false
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 197
        line_end: 198
        excerpt: |
          if(allItemsAvailable)
            po.setPoStatus(OrderStatusNames.COMPLETED);
  - record_key: SF-REQ-0001
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL produce an invoice document for each fulfilment pass that shipped at least one line, listing only the lines shipped in that pass, with the purchase order id, the original order date, the shipping date set to the current date and a fixed generic customer label.
    confidence: medium
    confidence_basis: Single code location; the invoice schema and consumer side are outside this module.
    risk_class: financial
    basis: createInvoice adds line items only if their item id is in the shipped map.
    plain_text: After shipping, the supplier sends an invoice covering only the items shipped in that round, dated today.
    technical_note: createInvoice builds TPAInvoiceXDE; user id is the literal "Dear PetStore Customer".
    interface: true
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      jms.queue: jms/opc/InvoiceTopic
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 146
        line_end: 166
        excerpt: |
          invoiceXDE.newDocument();
          invoiceXDE.setOrderId(po.getPoId());
          invoiceXDE.setUserId("Dear PetStore Customer");
          Date poDate = new Date(po.getPoDate());
          invoiceXDE.setOrderDate(poDate);
          Date curDate = new Date();
          invoiceXDE.setShippingDate(curDate);

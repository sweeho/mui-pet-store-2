  - record_key: SF-REQ-0002
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL let the supplier's stock clerk (administrator role) update inventory quantities from the inventory screen, applying only rows with a non-empty quantity that is zero or greater, and SHALL then re-attempt all pending purchase orders and send the resulting invoices, within one transaction.
    confidence: high
    confidence_basis: Servlet code, user guide section 4.1 and web.xml constraint agree.
    risk_class: operational
    basis: updateinventory screen runs updateInventory, processPendingPO and sendInvoices between ut.begin and ut.commit.
    plain_text: The stock clerk can set new stock quantities; negative or blank entries are ignored. After saving, waiting orders are retried and invoices go out.
    technical_note: RcvrRequestProcessor servlet, user-managed JTA transaction. Params item_<id> and qty_<id>.
    interface: false
    stack_metadata:
      framework: Servlet/JSP
      jsp.page: displayinventory.jsp
      ejb.transaction: UserTransaction
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 123
        line_end: 130
        excerpt: |
          String newQty = req.getParameter("qty_" + itemId);
          if((newQty == null) || (newQty.length() <= 0))
            continue;
          Integer qty = new Integer(newQty);
          if(qty.intValue() >= 0 ) {
            inventory = inventoryHomeRef.findByPrimaryKey(itemId);
            inventory.setQuantity(qty.intValue());
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 184
        line_end: 188
        excerpt: |
          ut.begin();        // start the xaction.
          updateInventory(req);
          Collection invoices = procPO.processPendingPO();
          sendInvoices(invoices);
          ut.commit();        // end xaction
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 72
        line_end: 77
        excerpt: |
          4.1 Viewing and editing inventory
          1. Click Display Inventory. A table shows the quantity of each item.
          After every update the Supplier notifies the OPC. The OPC checks whether it can now fulfil orders it
          could not fulfil before, and marks those orders completed.
  - record_key: SF-REQ-0003
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL restrict the supplier inventory update endpoint to authenticated users in the administrator role, using form-based login.
    confidence: high
    confidence_basis: web.xml security constraint plus a role check in the inventory page.
    risk_class: regulated
    basis: security-constraint on /RcvrRequestProcessor GET and POST requires role administrator; transport guarantee NONE.
    plain_text: Only signed-in supplier administrators can change stock; the connection need not be encrypted.
    technical_note: web.xml FORM login; displayinventory.jsp also tests request.isUserInRole("administrator").
    interface: false
    stack_metadata:
      framework: Servlet/JSP
      jsp.page: displayinventory.jsp
    traces:
      - path: legacy-source/app/src/apps/supplier/src/docroot/WEB-INF/web.xml
        line_start: 91
        line_end: 104
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/RcvrRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
  - record_key: SF-ENT-0001
    kind: entity
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL keep one inventory record per catalog item holding the item id and an integer quantity on hand, with operations to reduce and add quantity.
    confidence: medium
    confidence_basis: Entity bean abstract accessors only; DDL not examined in this shard. No lower-bound guard in reduce.
    risk_class: operational
    basis: InventoryEJB container-managed fields itemId and quantity.
    plain_text: The supplier tracks how many units of each item it has in stock.
    technical_note: CMP entity InventoryEJB; reduceQuantity subtracts without checking, caller checks first.
    interface: false
    stack_metadata:
      ejb.bean: InventoryEJB
      db.object: inventory
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
          }
suspected_defects:
  - capability_key: supplier-fulfillment
    record_keys: [SF-REQ-0002]
    severity: medium
    category: error-swallowed
    title: Inventory update errors are only printed, and the screen never completes
    description: >
      Every exception in the update path is caught and printed to the console; the transaction is neither committed nor rolled back explicitly and no response page is forwarded on failure. A malformed quantity (non-numeric) throws and also leaves the user with no response.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 206
  - capability_key: supplier-fulfillment
    record_keys: [SF-REQ-0001, SF-WF-0001]
    severity: medium
    category: error-swallowed
    title: Invoice build failure is swallowed after stock has been deducted
    description: >
      If invoice creation fails after lines were marked shipped and stock reduced, the exception is printed and null returned. No invoice is sent for lines now recorded as shipped, and later passes skip them.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 200
        line_end: 207
  - capability_key: supplier-fulfillment
    record_keys: [SF-REQ-0003]
    severity: low
    category: other
    title: Hard-coded invoice customer label and unencrypted admin login
    description: Invoice user id is the literal "Dear PetStore Customer"; web.xml sets transport guarantee NONE on the admin endpoint.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 149
        line_end: 149

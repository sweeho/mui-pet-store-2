  - record_key: ORDA-RULE-0003
    kind: business-rule
    capability_key: order-approval
    requirement: >
      WHEN an order-status update arrives for an order whose current status is not PENDING, the system SHALL ignore that update for that order (no status change, no supplier order, no customer notice).
    plain_text: >
      Only orders still waiting for a decision can be approved or denied; a repeat or late decision on an order already decided or completed is ignored.
    technical_note: >
      OrderApprovalMDB.doWork skips via continue when processManager.getStatus != PENDING. Provides idempotence on redelivery.
    confidence: high
    confidence_basis: Enforced in code with explanatory comment; user guide status table is consistent.
    risk_class: financial
    basis: PENDING guard.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 201
        line_end: 207
        excerpt: |
          // only PENDING orders can be updated
          //if order alreay APPROVED or DENIED or COMPLETED, then order
          //already processed so dont process again
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDA-RULE-0001]
    severity: medium
    category: contradicts-document
    title: Auto-approval limit boundary and locales differ between code and guides
    description: >
      Code approves strictly under 500 (US) / 50000 (JP) and never auto-approves any other locale (e.g. Chinese). The user guide says pending means "greater than 500", leaving exactly 500 undefined, and does not mention locale-dependent limits or that other locales always need manual approval. Limits compare raw totals with no currency handling.
    traces:

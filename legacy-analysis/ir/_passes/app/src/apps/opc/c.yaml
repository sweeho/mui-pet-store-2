    requirement: >
      WHEN a purchase order message arrives from the storefront, the system SHALL parse it, persist the purchase order, register an order-process record with status PENDING, and then evaluate automatic approval.
    plain_text: >
      When the store sends an order, the order center saves it, marks it as pending, and then checks whether it can be approved automatically.
    technical_note: >
      PurchaseOrderMDB.doWork: PurchaseOrder.fromXML (optional validation via env-entry), poHome.create, processManager.createManager(orderId, PENDING). Any exception is rethrown as EJBException so the container rolls back and redelivers.
    confidence: high
    confidence_basis: Code in one MDB plus runbook flow diagram.
    risk_class: operational
    basis: Order intake sequence in doWork.
    interface: true
    traces:

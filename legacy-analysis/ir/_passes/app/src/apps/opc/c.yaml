  - record_key: ORDA-RULE-0004
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL track each order through the states PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED, with PENDING as the initial state, PENDING moving only to APPROVED or DENIED by approval, and APPROVED moving to SHIPPED_PART or COMPLETED by supplier invoice.
    plain_text: >
      An order starts as pending, is then approved or denied, and if approved becomes partly shipped or completed as the supplier ships.
    technical_note: >
      Spread across PurchaseOrderMDB, OrderApprovalMDB (PENDING guard) and InvoiceMDB. InvoiceMDB does not check the current status, so an invoice can move a PENDING or DENIED order to COMPLETED/SHIPPED_PART.
    confidence: medium
    confidence_basis: Inferred from three transitions read in code; no single state table seen.
    risk_class: financial
    basis: Status constants used in the MDBs.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java

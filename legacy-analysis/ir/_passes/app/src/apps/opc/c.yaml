records:
  - record_key: ORDA-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received purchase order whose locale is US and whose total price is strictly less than 500, or whose locale is Japan and whose total price is strictly less than 50000; every other order SHALL remain PENDING.
    plain_text: >
      Small orders are approved without anyone looking at them: under 500 for US customers and under 50,000 for Japanese customers. Everything else waits for an administrator.
    technical_note: >
      PurchaseOrderMDB.canIApprove compares getTotalPrice() with bare literals; comment calls it a stub for currency conversion. Any other locale (e.g. zh_CN) is never auto-approved.
    confidence: high
    confidence_basis: >
      Enforced in code and stated in the runbook (US 500, JP 50000). Boundary wording in the user guide differs, and the limits are bare literals, so not above high.
    risk_class: financial
    basis: canIApprove returns true only for US below 500 or JAPAN below 50000.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (1.1 Order flow)
        excerpt: |
          total under limit (US 500, JP 50000)  --> APPROVED automatically
    stack_metadata:
      framework: EJB 2.0 MDB
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required

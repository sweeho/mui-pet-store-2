records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received purchase order when its locale is US and its total price is strictly below 500, or its locale is Japan and its total price is strictly below 50000; every other order SHALL remain PENDING.
    plain_text: >
      A new US order under 500, or a Japanese order under 50,000, is approved without a person. All other orders wait for an administrator.
    technical_note: >
      PurchaseOrderMDB.canIApprove compares getTotalPrice() with bare literals per Locale. Currency unit is not stated in code.
    interface: false
    confidence: high
    confidence_basis: >
      Code literals plus the runbook and user guide state the same limits (US 500, JP 50000). Limits are bare literals with no config.
    risk_class: financial
    basis: Locale-specific limits hard-coded; documents agree.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 190
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1
        excerpt: "total under limit (US 500, JP 50000)  --> APPROVED automatically"
    stack_metadata:
      framework: EJB 2.x MDB
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Container
  - record_key: ORDER-APPROVAL-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an order whose locale is neither US nor Japan (for example Chinese), WHEN it is received, THEN the system SHALL leave it PENDING regardless of total, because no automatic limit exists for that locale.
    plain_text: >
      Orders from locales other than the US and Japan never approve automatically.
    technical_note: >
      canIApprove falls through to return false for any other locale; no limit defined for zh_CN although the store serves it.
    confidence: medium
    confidence_basis: One clear place (fall-through); no document speaks to other locales.
    risk_class: financial
    basis: Implicit consequence of the if/else chain.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          } else if (locale.equals(Locale.JAPAN))  {
            if (purchaseOrder.getTotalPrice() < 50000) return true;
          }
          return false;
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
  - record_key: CHECKOUT-ORDER-PLACEMENT-WF-0001
    kind: workflow
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL, on receiving a purchase order message from the storefront, persist the purchase order and register it with the process manager with status PENDING before evaluating automatic approval.
    plain_text: >
      Every order received from the storefront is saved and starts out as pending.
    technical_note: >
      PurchaseOrderMDB.doWork parses the XML (optional schema validation by env-entry), poHome.create, processManager.createManager(orderId, PENDING). Any failure rethrown as EJBException (message redelivery under container transaction).
    interface: true
    confidence: high
    confidence_basis: Code plus runbook flow diagram and user guide.
    risk_class: operational
    basis: Order intake from OrderQueue.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 152
        line_end: 157
        excerpt: |
          PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
          poHome.create(purchaseOrder);
          //update process manager to start workflow for this purchase order
          processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1
        excerpt: "Storefront --OrderQueue--> OPC PurchaseOrderMDB"
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: jms/opc/OrderQueue
  - record_key: ORDER-APPROVAL-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL, for an automatically approved order, emit an order-approval message for that order with status APPROVED to the same approval path used for manual approvals, and SHALL emit nothing when the order is not auto-approved.
    plain_text: >
      An order approved automatically follows the same path as one approved by an administrator.
    technical_note: >
      PurchaseOrderMDB builds ChangedOrder(APPROVED) in an OrderApproval XML and PurchaseOrderTD forwards it (queue helper). Null result means wait for admin.
    interface: true
    confidence: medium
    confidence_basis: Seen in MDB; PurchaseOrderTD target queue not read in detail.
    risk_class: operational
    basis: Auto-approval is modelled as a synthetic approval message.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 158
        line_end: 164
        excerpt: |
          if(canIApprove(purchaseOrder)) {
            ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
            OrderApproval oa = new OrderApproval();
            oa.addOrder(co);
            ret = oa.toXML();
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      framework: JMS
  - record_key: ORDER-APPROVAL-BR-0003
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an order-approval message containing an order whose current status is not PENDING, WHEN it is processed, THEN the system SHALL ignore that order: no status change, no supplier order, no notification.
    plain_text: >
      An order that was already approved, denied or completed cannot be changed again by a later approval or denial.
    technical_note: >
      OrderApprovalMDB.doWork checks processManager.getStatus and continues past non-PENDING orders, so they are also left out of the mail list.
    interface: false
    confidence: high
    confidence_basis: Code with explanatory comment; user guide status table is consistent.
    risk_class: financial
    basis: Idempotence guard on the state machine.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 201
        line_end: 207
        excerpt: |
          // only PENDING orders can be updated
          //if order alreay APPROVED or DENIED or COMPLETED, then order
          //already processed so dont process again
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

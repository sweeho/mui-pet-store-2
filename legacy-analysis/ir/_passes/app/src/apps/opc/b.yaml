  - record_key: SF-RULE-0005
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: >
      GIVEN a supplier invoice message WHEN the invoice, together with prior invoices, covers all line items of the order THEN the system SHALL mark the order COMPLETED and trigger the completed-order notification; otherwise it SHALL mark the order SHIPPED_PART and send no completion message.
    confidence: medium
    confidence_basis: Branch is in InvoiceMDB; the completeness test is inside PurchaseOrderHelper.processInvoice, outside this shard and not read.
    risk_class: operational
    basis: InvoiceMDB.doWork.
    plain_text: >
      When the supplier reports shipped items, the order is completed once everything has shipped; until then it is shown as partly shipped.
    technical_note: Invoice arrives on jms/opc/InvoiceTopic; InvoiceTD forwards the completed order id to the completed-order mail queue.
    interface: true
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.queue: jms/opc/InvoiceTopic

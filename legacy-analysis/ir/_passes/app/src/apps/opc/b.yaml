suspected_defects:
  - capability_key: order-approval
    record_keys: [OA-RULE-0001]
    severity: medium
    category: contradicts-document
    title: Auto-approval limit boundary and locale coverage differ from user guide
    description: >
      Code approves strictly below 500 (exactly 500 is pending) and only for US and Japan; any other locale is never auto-approved. The user guide says pending means greater than 500 and mentions only the dollar limit.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: 3.3 Approving or denying orders
  - capability_key: order-administration
    record_keys: [OAD-REQ-0009]
    severity: low
    category: inconsistent-rounding
    title: Revenue totals accumulated in single-precision floats
    description: Revenue is summed as Float, so large totals may lose precision.
    traces:

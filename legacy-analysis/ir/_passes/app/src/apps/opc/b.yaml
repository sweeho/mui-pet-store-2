  - record_key: CUSTOMER-NOTIFICATIONS-BR-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send order-status (approval/denial), shipment (invoice) and completed-order e-mails only when the corresponding configuration switch is enabled, and SHALL send none of them by default.
    plain_text: >
      Customer e-mails about order status, shipment and completion are off unless an administrator turns them on.
    technical_note: >
      Env-entries param/SendApprovalMail (MailOrderApprovalMDB), param/SendConfirmationMail (MailInvoiceMDB), param/SendCompletedOrderMail (MailCompletedOrderMDB), read via getBoolean; value is redacted in the extract so the default is taken from the admin guide ("disabled by default"). Admin guide maps SendConfirmationMail to InvoiceMDB, the mail bean is MailInvoiceMDB.
    interface: true
    confidence: medium
    confidence_basis: Switch visible in code; default value redacted in the source, stated in a document.
    risk_class: operational
    basis: Each mail MDB checks its flag before work.
    traces:

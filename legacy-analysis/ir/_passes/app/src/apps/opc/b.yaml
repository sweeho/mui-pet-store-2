records:
  - record_key: OA-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL record each received purchase order with status PENDING and SHALL approve it automatically only when its locale is US and its total price is strictly below 500, or its locale is Japan and its total price is strictly below 50000; any other order SHALL remain PENDING awaiting manual approve/deny.
    confidence: high
    confidence_basis: >
      Literal limits in code, and the operations runbook states the same limits (US 500, JP 50000). Not higher because the limits are bare literals with no configuration.
    risk_class: financial
    basis: PurchaseOrderMDB.canIApprove compares total price with literals per locale; no other locale has a limit.
    plain_text: >
      Orders under 500 (US) or under 50,000 (Japan) are approved automatically. All other orders, including every order from any other locale, wait for a person to approve or deny them.
    technical_note: >
      PurchaseOrderMDB.doWork creates the PO entity, creates the process-manager record as PENDING, then canIApprove; if true an OrderApproval XML (APPROVED) is sent to the approval queue via PurchaseOrderTD.
    interface: false
    stack_metadata:
      framework: EJB 2.x MDB
      ejb.bean: PurchaseOrderMDB
      jms.queue: jms/opc/OrderQueue
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: workflow diagram (total under limit US 500, JP 50000)
        excerpt: "total under limit (US 500, JP 50000)  --> APPROVED automatically"
  - record_key: OA-RULE-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an approval or denial message for an order WHEN the order's current status is not PENDING THEN the system SHALL ignore that order (no status change, no supplier purchase order, no notification); for PENDING orders it SHALL set the new status and, for APPROVED orders only, forward a supplier purchase order built from the stored order.
    confidence: medium
    confidence_basis: One clear guard with an explanatory comment; user guide describes statuses but not this idempotence rule.
    risk_class: operational
    basis: OrderApprovalMDB.doWork skips non-PENDING orders and only builds the supplier PO for APPROVED.
    plain_text: >
      Only orders still waiting for a decision can be approved or denied. A decision on an order already decided or completed is ignored. Approved orders are sent to the supplier; denied ones are not.
    technical_note: >
      OrderApprovalMDB.doWork consults ProcessManager.getStatus; the filtered list (oaMailList) goes to the customer mail queue; supplier POs go to the supplier PO queue via OrderApprovalTD.
    interface: true
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: jms/opc/OrderApprovalQueue
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 200
        line_end: 224
        excerpt: |
          // only PENDING orders can be updated
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
          oaMailList.addOrder(co);
          processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
  - record_key: OA-WORKFLOW-0003
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL move an order through statuses PENDING, then APPROVED or DENIED, then SHIPPED_PART when an invoice covers only some line items, and COMPLETED when an invoice leaves every line item shipped.
    confidence: high
    confidence_basis: Transitions in three MDBs plus the user guide status table.
    risk_class: operational
    basis: PurchaseOrderMDB sets PENDING, OrderApprovalMDB sets APPROVED/DENIED, InvoiceMDB sets SHIPPED_PART or COMPLETED.
    plain_text: >
      An order starts waiting, is approved or denied, and once the supplier invoices it becomes partly shipped and finally completed.
    technical_note: Status is held in the ProcessManager entity; transitions are driven by JMS messages between MDBs through transition delegates.
    interface: false
    stack_metadata:
      ejb.bean: InvoiceMDB, OrderApprovalMDB, PurchaseOrderMDB
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 158
        line_end: 173
        excerpt: |
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: status table (PENDING, APPROVED ...)
        excerpt: "APPROVEDApproved and sent to the Supplier, not yet fully invoiced"

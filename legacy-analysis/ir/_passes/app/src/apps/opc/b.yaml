  - record_key: LOCALIZATION-BR-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a stored order locale string "language_country" as that locale, "default" as the server default locale, and a null or underscore-less value as no locale.
    plain_text: >
      The language of customer e-mails follows the locale recorded on the order.
    technical_note: >
      LocaleUtil.getLocaleFromString. Variant parsing is dead (variantIndex is never assigned), and a three-part string loses its country.
    confidence: medium
    confidence_basis: One place; the variant branch is unreachable as read.
    risk_class: presentational
    basis: Locale parsing helper.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 48
        line_end: 53
        excerpt: |
          if (localeString == null) return null;
          if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
          int languageIndex = localeString.indexOf('_');
          if (languageIndex  == -1) return null;
    stack_metadata:
      ejb.bean: LocaleUtil
suspected_defects:
  - capability_key: localization
    record_keys: [LOCALIZATION-BR-0001]
    severity: low
    category: unreachable-branch
    title: Locale variant is never parsed
    description: >
      variantIndex is initialised to -1 and never reassigned, so the variant branch cannot run; countryIndex is reassigned instead, and for a language_country_variant string country stays null.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java

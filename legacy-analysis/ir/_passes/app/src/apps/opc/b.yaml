  - record_key: SUPPLIER-FULFILLMENT-WF-0001
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL, for each order newly set to APPROVED, build a supplier purchase order (order id, date, shipping name/address/email/telephone, and each line with category, product, item, line number, quantity, unit price) and send it to the supplier purchase-order queue; DENIED orders SHALL NOT be sent.
    plain_text: >
      When an order is approved, a purchase order with the shipping details and every line is sent to the supplier. Denied orders are not sent.
    technical_note: >
      OrderApprovalMDB.getXmlPO uses TPASupplierOrderXDE; OrderApprovalTD sends each to SUPPLIER_PURCHASE_ORDER_QUEUE then sends the mail list. Order of sends: all supplier POs first, then mail message.
    interface: true
    confidence: high
    confidence_basis: Code in two classes and runbook flow.
    risk_class: operational
    basis: Hand-off to supplier on approval.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 220
        line_end: 226
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/OrderApprovalTD.java
        line_start: 78
        line_end: 90
        excerpt: |
          supplierQueueHelper.sendMessage(xmlPO);
          //send the list of valid order approval/deny to customer relations
          sendMail(xmlMailOrderApprovals);
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: SUPPLIER_PURCHASE_ORDER_QUEUE
  - record_key: SUPPLIER-FULFILLMENT-WF-0002
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL, on receiving a supplier invoice, mark the order COMPLETED when every line of the order has been invoiced, and otherwise mark it SHIPPED_PART; only a COMPLETED outcome SHALL trigger the completed-order notification step.
    plain_text: >
      When the supplier invoices shipped goods, the order is completed once all lines have shipped; until then it is partly shipped.
    technical_note: >
      InvoiceMDB.doWork: PurchaseOrderHelper.processInvoice(po, lineItemIds) returns orderDone; updateStatus COMPLETED or SHIPPED_PART; InvoiceTD sends to completed-order mail queue only when COMPLETED. Invoice arrives via InvoiceTopic. SHIPPED_PART is not in the user guide status table.
    interface: true
    confidence: high
    confidence_basis: Code plus runbook and user guide COMPLETED definition.
    risk_class: operational
    basis: Fulfilment join condition.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 161
        line_end: 172
        excerpt: |
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md

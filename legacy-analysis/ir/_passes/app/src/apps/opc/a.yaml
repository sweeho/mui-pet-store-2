records:
  - record_key: ORD-APPR-REQ-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a received order when its locale is US and its total price is below 500, or its locale is Japan and its total price is below 50000.
    confidence: high
    confidence_basis: >
      Enforced in code with bare literals, and stated in the operations runbook (US 500, JP 50000) and user guide (orders under 500 approved automatically). Code plus documents gives high.
    risk_class: financial
    basis: >
      canIApprove compares the order total with a per-locale literal limit; no configuration source for the limits was found.
    plain_text: >
      Small orders are approved without a person: under 500 for US customers and under 50,000 for Japanese customers.
    technical_note: >
      PurchaseOrderMDB.canIApprove; limits are hard-coded literals. Strict less-than, so a total exactly at the limit is not auto-approved.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 190
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: order flow diagram (Storefront --OrderQueue--> OPC PurchaseOrderMDB)
        excerpt: |
          total under limit (US 500, JP 50000)  --> APPROVED automatically
    stack_metadata:
      framework: EJB 2.x MDB
      ejb.bean: PurchaseOrderMDB
      jms.queue: jms/opc/OrderQueue
  - record_key: ORD-APPR-REQ-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN a received order whose locale is neither US nor Japan, or whose total is not below the locale limit, WHEN it is received, THEN the system SHALL leave it in PENDING status until an administrator approves or denies it.
    confidence: high
    confidence_basis: >
      canIApprove returns false by default, and the code comment says it waits for admin; runbook and user guide agree for US/JP. Behaviour for other locales (e.g. Chinese) is only inferred from the default false.
    risk_class: financial
    basis: >
      No approval message is produced when canIApprove is false; the order stays in PENDING as created by the process manager.
    plain_text: >
      Orders that are not small enough, and orders from any other country than the US or Japan, wait for a person to approve or deny them.
    technical_note: >
      PurchaseOrderMDB.onMessage only calls doTransition when doWork returns a non-null approval XML.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 124
        line_end: 126
        excerpt: |
          if(approval != null) {
            doTransition(approval);
          } //else wait for admin to approve/deny orders
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: order flow diagram
        excerpt: |
          otherwise                              --> PENDING until the Admin client approves or denies
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
  - record_key: ORD-APPR-REQ-0003
    kind: workflow
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL, on receiving an order message from the storefront, persist the purchase order and register it with the process manager in PENDING status before any approval decision.
    confidence: medium
    confidence_basis: >
      One clear place in code (PurchaseOrderMDB.doWork), plus the runbook flow description; no second enforcement point.
    risk_class: operational
    basis: >
      doWork parses the order XML (optionally schema-validated), creates the purchase order entity and creates a workflow manager record with PENDING.
    plain_text: >
      When an order arrives from the online store it is saved and starts out as pending.
    technical_note: >
      Order XML validation is switched by an environment entry. Any parse/create/transition failure is rethrown as EJBException, so the JMS message is rolled back and redelivered.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 152
        line_end: 157
        excerpt: |
          PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
          poHome.create(purchaseOrder);
          //update process manager to start workflow for this purchase order
          processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: jms/opc/OrderQueue
  - record_key: ORD-APPR-REQ-0004
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL apply an approval or denial decision only to an order currently in PENDING status and SHALL silently ignore a decision for an order in any other status.
    confidence: high
    confidence_basis: >
      Guarded in code with an explanatory comment, and the user guide says only pending orders can be approved or denied.
    risk_class: financial
    basis: >
      OrderApprovalMDB skips orders whose status is not PENDING; skipped orders are not added to the notification list.
    plain_text: >
      Once an order has been approved, denied or completed its status cannot be changed again by a later decision.
    technical_note: >
      Status compared with OrderStatusNames.PENDING via the process manager; no error or log for the ignored decision.

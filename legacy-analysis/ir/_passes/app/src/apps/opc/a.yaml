  - record_key: ORD-APPR-REQ-0007
    kind: workflow
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL, on receiving a supplier invoice, record the invoiced line items on the purchase order and set the order to COMPLETED when every line is shipped, otherwise to SHIPPED_PART.
    confidence: high
    confidence_basis: >
      Code in InvoiceMDB plus runbook and user guide describing completion when all lines are shipped.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice returns whether the order is complete; the result chooses the status. Only completed orders trigger a further notification.
    plain_text: >
      When the supplier invoices items, the order is marked completed once everything has shipped; until then it is marked partly shipped.
    technical_note: >
      The intermediate status SHIPPED_PART is not listed in the user guide status table or the runbook.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 160
        line_end: 171
        excerpt: |
          invoiceXDE.setDocument(xmlInvoice);
          PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

          //update process manager if this order is completely done, or partially done
          //for this purchase order
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: order flow diagram
        excerpt: |
          OPC marks the order COMPLETED when every line is shipped
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.queue: jms/opc/InvoiceTopic

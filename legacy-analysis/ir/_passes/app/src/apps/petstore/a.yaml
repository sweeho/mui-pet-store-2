  - record_key: CHECKOUT-REQ-0001
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      GIVEN a customer submits an order whose shopping cart has no items, WHEN the order is processed, THEN the system SHALL refuse the order and show the empty-cart order error screen.
    confidence: high
    confidence_basis: >
      Enforced by an explicit check in the order action, an exception class, and an exception-to-screen mapping in mappings.xml (code + config).
    risk_class: operational
    basis: Order action throws ShoppingCartEmptyOrderException when cart items collection is empty; mapping routes it to cart_empty_order_error.screen.
    plain_text: An order cannot be placed with an empty cart; the customer is shown an explanatory error page.
    technical_note: OrderEJBAction.perform throws ShoppingCartEmptyOrderException; mappings.xml exception-mapping selects cart_empty_order_error.screen.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 129
        line_end: 132
        excerpt: |
              // if the cart is empty throw an exception saying so
              if (items.size() == 0) {
                throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
              }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 98
        line_end: 98
        excerpt: |
              <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
    stack_metadata:
      framework: WAF (Sun Blueprints web application framework)
      ejb.bean: OrderEJBAction

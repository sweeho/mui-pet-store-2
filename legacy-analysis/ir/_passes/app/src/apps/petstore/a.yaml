  - record_key: CHECKOUT-INT-0004
    kind: integration
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL send each placed order as an XML purchase-order message asynchronously to the Order Processing Center, and SHALL then empty the shopping cart and return the order id and bill-to e-mail to the customer.
    confidence: high
    confidence_basis: Code (OrderEJBAction) plus user guide stating asynchronous send to the OPC and runbook naming the order queue.
    risk_class: financial
    basis: sendAMessage(purchaseOrder.toXML()) followed by cart.empty() and OrderEventResponse.
    plain_text: When a customer places an order it is handed to the back-office order processing system, the cart is cleared and the customer gets an order number.
    technical_note: AsyncSender EJB posts to JMS (jms/opc/OrderQueue per runbook).

findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/populate/Populate-UTF8.xml
    description: >
      Seed-data population (PopulateServlet, DTDs, Populate-UTF8.xml) loads sample users, catalog and accounts. Not analysed as requirements; a human should decide whether sample data is in scope for the rebuild.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: >
      Message-send failures (service locator, XML, create) are caught and printed, then the order proceeds and the cart is emptied. Behaviour on failure is therefore that the customer sees success without the OPC receiving the order; recorded as a suspected defect.
suspected_defects:
  - capability_key: checkout-order-placement
    record_keys: [CHECKOUT-INT-0004]
    severity: high
    category: error-swallowed
    title: Order send failures are swallowed and the cart is still emptied
    description: >
      If the order message cannot be built or sent, the exception is printed and ignored; the cart is emptied and a confirmation is returned, so the order is lost silently.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 154
        line_end: 167
  - capability_key: checkout-order-placement
    record_keys: [CHECKOUT-REQ-0005]
    severity: medium
    category: other
    title: Checkout ignores the customer's card and uses a hardcoded expired card
    description: >
      Every order carries card 1234-2334, Duke Express, expiry 10/2001 regardless of what the customer entered.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 82
        line_end: 82
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0006]
    severity: medium
    category: other

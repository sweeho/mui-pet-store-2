records:
  - record_key: CHECKOUT-REQ-0001
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL reject checkout when any of the billing or shipping fields last name, first name, street address, city, state or province, postal code or telephone number is empty after trimming whitespace, and SHALL treat second street line as optional and email as optional.
    confidence: medium
    confidence_basis: >
      One clear place (OrderHTMLAction); no declarative validator or test. The missing-field exception is stored as a request attribute and the extractor returns null, so how the user is told was not traced in this module.
    risk_class: operational
    basis: Address parsing collects a list of missing field names and sets a MissingFormData attribute; empty address2 becomes null.
    plain_text: >
      A customer must fill in name, street, city, state or province, postal code and telephone for both billing and shipping before an order is accepted. A second address line and e-mail are optional.
    technical_note: >
      OrderHTMLAction.extractContactInfo is called twice with suffixes _a and _b. Missing labels are gathered into MissingFormDataException and put on the request; the method returns null. Country is not validated.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 150
        line_end: 154
        excerpt: |
          if (missingFields != null) {
          MissingFormDataException ex = new MissingFormDataException("Missing Address Data", missingFields);
          request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);
    stack_metadata:
      framework: WAF HTMLAction
      form_bean: none (request parameters)
  - record_key: CHECKOUT-REQ-0002
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      GIVEN a customer submits an order WHEN the shopping cart contains no items THEN the system SHALL refuse the order with a cart-empty error and SHALL NOT create a purchase order.
    confidence: high
    confidence_basis: >
      Enforced in code (OrderEJBAction) and mapped to a dedicated error screen in mappings.xml and screen definitions.
    risk_class: operational
    basis: Empty item collection throws ShoppingCartEmptyOrderException, mapped to cart_empty_order_error.screen.
    plain_text: An order cannot be placed with an empty cart; the customer sees an empty-cart error page.
    technical_note: >
      OrderEJBAction checks items.size()==0; exception-mapping in mappings.xml routes to cart_empty_order_error.screen. Note the check runs after the order id has been drawn from the id generator.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
          throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
  - record_key: CHECKOUT-REQ-0003
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL build a purchase order carrying a unique order id, the signed-on user id, billing e-mail, order date, shipping and billing contact, credit card, locale and one line per cart item (category, product, item, line number from 0, quantity, unit cost), with total price equal to the sum of unit cost times quantity.
    confidence: medium
    confidence_basis: >
      One clear place (OrderEJBAction). Total is a Java float sum; no test or document states the arithmetic.
    risk_class: financial
    basis: OrderEJBAction assembles the PurchaseOrder from the cart and facade state.
    plain_text: When an order is placed, it is recorded with a unique number, the customer, date, addresses, card, the language of the order, each purchased item with quantity and price, and a total.
    technical_note: >
      Order id from UniqueIdGenerator.getUniqueId("1001"); total computed in float, not decimal; locale taken from the state machine attribute.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java

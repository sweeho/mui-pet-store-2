  - record_key: CHECKOUT-RULE-0001
    kind: business-rule
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL attach to every order a fixed credit card (number 1234-2334, type Duke Express, expiry 10/2001) rather than card data entered by the customer.
    confidence: medium
    confidence_basis: >
      One clear place, with a code comment saying the card should be part of the form; reachable through the order.do mapping. Intent for the rebuild is unknown.
    dispute:
      reason: other
      detail: >
        User guide says the checkout form is pre-filled with billing and shipping details; neither it nor the code shows card capture at order time. A person must decide whether card entry is required in the rebuild.
    risk_class: regulated
    basis: OrderHTMLAction constructs a CreditCard literal and never reads card fields from the request.
    plain_text: Today every order is charged to the same placeholder card; the customer's own card details are not used at checkout.
    technical_note: >
      OrderHTMLAction.perform: new CreditCard("1234-2334","Duke Express","10/2001") with comment XXXX this needs to be part of the form.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 80
        line_end: 83

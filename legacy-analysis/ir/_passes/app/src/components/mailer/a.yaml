suspected_defects:
  - capability_key: customer-notifications
    record_keys: [NOTIF-RULE-0001]
    severity: medium
    category: error-swallowed
    title: Mail send failures are silently discarded
    description: >
      Any send failure is logged to stderr only and the message is dropped; the customer gets no notification and nobody is alerted.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 86
  - capability_key: localization
    record_keys: [NOTIF-REQ-0001]
    severity: low
    category: other
    title: Locale is accepted but ignored when sending mail
    description: >
      The sender passes Locale.getDefault() (server locale), and the helper never uses it, so the mail is not localized per customer.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 82

  - record_key: CHK-INT-0001
    kind: integration
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL serialise an address to an XML Address element with StreetName (line 1), a second StreetName only when line 2 is non-null and non-empty, then City, State, ZipCode and Country, and SHALL read it back in that order.
    confidence: high
    confidence_basis: >
      Writer, reader and DTD all state the layout (three places in the module). Which documents embed it (purchase orders) is not shown here.
    risk_class: operational
    basis: toDOM/fromDOM and Address.dtd.
    plain_text: >
      When an address is passed to another system as a document, it appears in a fixed layout with the second street line included only if present.
    technical_note: >
      Address.toDOM/fromDOM use XMLDocumentUtils; DTD public id "Address 1.1". Used as a building block of order/PO XML documents.
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 147
        line_end: 149
        excerpt: |
          if (streetName2 != null && !streetName2.equals("")) {
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
          }
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      framework: DOM XML document
  - record_key: CHK-BR-0002
    kind: business-rule
    capability_key: checkout-order-placement
    requirement: >
      GIVEN an incoming Address XML element lacking a Country child WHEN it is read THEN the system SHALL reject it as malformed, although the schema marks Country optional.
    confidence: medium
    confidence_basis: >
      The reader passes optional=false for Country (one place), while the DTD says optional; I did not read XMLDocumentUtils to confirm the exact failure.
    dispute:
      reason: conflicting-sources
      detail: >
        DTD declares Country optional; fromDOM requires it. Settle by checking XMLDocumentUtils.getNextSibling semantics and whether any sender omits Country.
    risk_class: operational
    basis: fromDOM final country read uses required flag.
    plain_text: >
      An address document without a country is refused when read, even though its published layout says country may be left out.
    technical_note: >
      getNextSibling(child, XML_COUNTRY, false) vs DTD "Country?".
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 173
        line_end: 175
        excerpt: |
          child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
          address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
          child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      framework: DOM XML document
  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL delete a purchase order's address together with its order when a COMPLETED or DENIED order older than 180 days is purged.
    confidence: low
    confidence_basis: >
      Stated only in the operations runbook; the address bean's own remove is a no-op and the purge code is outside this module.
    risk_class: regulated
    basis: Runbook describes purge including addresses.
    plain_text: >
      Customer addresses on finished or denied orders are deleted along with the order after 180 days.
    technical_note: >
      Purge runs weekly (Sundays) as a batch; AddressEJB.ejbRemove is empty, container deletes the row.
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: purge job section
        line_start: 91
        line_end: 93
        excerpt: |
          Deletes COMPLETED and DENIED orders older than 180 days, with their order lines, supplier orders,
          contact information, addresses and payment cards.
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 126
        line_end: 126
        excerpt: |
          public void ejbRemove() throws RemoveException { }
    stack_metadata:
      ejb.bean: AddressEJB

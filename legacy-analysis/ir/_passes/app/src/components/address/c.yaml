    requirement: >
      The system SHALL represent a postal address as street line 1, optional street line 2, city, state, zip code and country, and SHALL persist it as a standalone record created from either the six values or an existing address value.
    confidence: high
    confidence_basis: >
      Fields are declared in the value class, the persistent bean and the deployment descriptor (three places). Which business flows own addresses is not visible in this module.
    risk_class: operational
    basis: Six persistent fields in the bean, matching the value object and descriptor.
    plain_text: >
      An address consists of two street lines (the second optional), city, state, postal code and country, and is stored as its own record.
    technical_note: >
      AddressEJB (CMP 2.x entity, local interface only) with ejbCreate(6 strings) and ejbCreate(Address); Address is the serialisable value object returned by getData(). The entity has no finders and no validation.

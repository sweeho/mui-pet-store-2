records:
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL hold a postal address as six text fields: street line 1, street line 2, city, state, zip code and country.
    confidence: high
    confidence_basis: >
      The six fields appear in the container-managed field list, the accessors and the create/copy methods (code plus declarative config). No length or format constraint is visible in this module.
    risk_class: operational
    basis: The persistent address bean declares exactly six container-managed fields, all strings.
    plain_text: >
      An address consists of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      CMP 2.x entity AddressEJB, abstract schema Address; fields listed in ejb-jar.xml and accessors in AddressEJB.java. No validation in this component; validation lives with callers.
    interface: false
    traces:
      - path: legacy-source/app/src/components/address/src/ejb-jar.xml
        line_start: 56
        line_end: 80
        excerpt: |
          <abstract-schema-name>Address</abstract-schema-name>
          <cmp-field>
            <description>no description</description>
            <field-name>zipCode</field-name>
          </cmp-field>
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: AddressEJB
      db.object: Address abstract schema

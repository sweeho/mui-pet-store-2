  - record_key: CHECKOUT-REQ-0002
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL, in the web tier, provide one shared lookup instance per process and cache each resolved EJB home, JMS factory, queue, topic and data source by name so repeat lookups do not re-query the naming directory.
    confidence: high
    confidence_basis: >
      Stated in class comment and enforced in code (static singleton, synchronized map, containsKey/put in each cached method); the ejb variant lacks it, contrasting.
    risk_class: operational
    basis: >
      Class doc says singleton and caching strategy for web tier only.
    plain_text: >
      On the web side, resources already found once are remembered and reused instead of being looked up again.
    technical_note: >
      web.ServiceLocator: static me built in static initialiser; cache = Collections.synchronizedMap(new HashMap()); getInstance() returns me. Cache has no eviction or invalidation.
    interface: false

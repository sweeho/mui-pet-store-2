      Cross-cutting utility; no business rule of its own. No listed capability fits, filed under checkout-order-placement as nearest consumer (order entry sends JMS and uses EJBs).
    plain_text: >
      Other parts of the application find the services, message queues, databases and settings they need by name through one shared lookup facility.
    technical_note: >
      Service Locator pattern over javax.naming.InitialContext; methods getLocalHome, getRemoteHome (with PortableRemoteObject.narrow), getQueueConnectionFactory, getQueue, getTopicConnectionFactory, getTopic, getDataSource, getUrl, getBoolean, getString.

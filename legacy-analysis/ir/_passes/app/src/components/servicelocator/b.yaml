  - record_key: CHECKOUT-REQ-0005
    kind: business-rule
    capability_key: checkout-order-placement
    requirement: >
      GIVEN the web-tier lookup service WHEN a URL, boolean or string environment entry is requested THEN the system SHALL read it from the naming directory on every call without caching.
    confidence: medium
    confidence_basis: >
      Visible in one file; whether intentional (so config changes are picked up) is not stated.
    risk_class: operational
    basis: >
      getUrl/getBoolean/getString call ic.lookup directly, unlike other methods.
    plain_text: >
      Configuration settings such as whether to send confirmation e-mails are read fresh each time.
    technical_note: >
      getBoolean unboxes the Boolean result; a missing/null value would raise NullPointerException wrapped by the generic catch only if thrown inside try (unboxing is outside the try).
    interface: false

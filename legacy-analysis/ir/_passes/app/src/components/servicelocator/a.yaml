  - record_key: BATCH-REQ-0003
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      GIVEN a resource lookup fails for any reason (name not found or wrong type), the locator SHALL raise a single ServiceLocatorException wrapping the original cause, and SHALL expose the root cause through recursive unwrapping.
    confidence: high
    confidence_basis: >
      Same catch pattern in every getter of both classes plus the exception class itself.
    risk_class: operational
    basis: >
      Each getter catches NamingException and Exception and rethrows wrapped.
    plain_text: >
      When a required shared service cannot be found, callers get one uniform "lookup failed" error that keeps the original reason.
    technical_note: >
      ServiceLocatorException.getRootCause recurses through nested ServiceLocatorException instances.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 87
        line_end: 97
        excerpt: |
          /**
             * Retrieves (recursively) the root cause exception.
             *
             * @return the root cause exception.
             */
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 227
        excerpt: |
          public boolean getBoolean(String envName) throws ServiceLocatorException {
            Boolean bool = null;
            try {
              bool = (Boolean)ic.lookup(envName);
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
            return bool.booleanValue();
          }
    stack_metadata:
      framework: J2EE JNDI

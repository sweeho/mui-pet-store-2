  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The web-tier locator SHALL be a single shared instance and SHALL cache looked-up EJB homes, JMS connection factories, queues, topics and data sources by name so repeat requests reuse the first result.
    confidence: high
    confidence_basis: >
      Class comment plus code in five getters; the contrasting ejb-tier class has no cache.
    risk_class: operational
    basis: >
      Web variant uses a synchronized map checked before each lookup; URL, boolean and string entries are not cached.
    plain_text: >
      On the web side, a shared service once found is remembered and reused, so it is not looked up again; configuration values are looked up fresh each time.
    technical_note: >
      Static singleton created in a static initializer; cache = Collections.synchronizedMap(new HashMap()); containsKey/get else lookup/put. The ejb-tier variant is instantiable per caller with no cache.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 59
        line_end: 96
        excerpt: |
          This implementation uses the "singleton" strategy and also the "caching"
           * strategy.
          ...
              cache = Collections.synchronizedMap(new HashMap());
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          if (cache.containsKey(jndiHomeName)) {
              home = (EJBLocalHome) cache.get(jndiHomeName);
          } else {
              home = (EJBLocalHome) ic.lookup(jndiHomeName);
              cache.put(jndiHomeName, home);
          }

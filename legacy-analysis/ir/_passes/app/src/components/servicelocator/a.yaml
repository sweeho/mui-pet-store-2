suspected_defects:
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0002]
    severity: medium
    category: error-swallowed
    title: Web locator singleton failure is only printed, leaving a null instance
    description: >
      If the web-tier locator cannot be constructed in its static initializer, the error is printed to stderr and the shared instance stays null; getInstance then returns null and callers hit a NullPointerException rather than a lookup error.
    traces:

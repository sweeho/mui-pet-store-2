  - record_key: BATCH-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL provide a central lookup facility that resolves named container resources (local and remote EJB homes, JMS queue and topic connection factories, queues, topics, data sources, URL, boolean and string environment entries) by their JNDI name.
    confidence: high
    confidence_basis: >
      Implemented identically in two classes (web and ejb tier) and described in class comments; no tests or config seen.
    risk_class: operational
    basis: >
      Both ServiceLocator classes expose one getter per resource type, each doing an InitialContext lookup. No listed capability fits this shared infrastructure; filed under batch-operations as closest.
    plain_text: >
      Every part of the application finds the shared services it needs (databases, message queues, other components, configuration switches) through one common lookup point, by name.
    technical_note: >
      ServiceLocator (web and ejb variants) wraps javax.naming.InitialContext; getLocalHome, getRemoteHome (with PortableRemoteObject.narrow), getQueueConnectionFactory, getQueue, getTopicConnectionFactory, getTopic, getDataSource, getUrl, getBoolean, getString.

  - record_key: CHECKOUT-REQ-0002
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The web-tier locator SHALL be a singleton that caches looked-up EJB homes, JMS factories, queues, topics and data sources by name for reuse, while URL, boolean and string environment entries are looked up each time.
    confidence: medium
    confidence_basis: >
      Clearly visible in one class; the ejb-tier variant has no cache, which is a difference rather than corroboration.
    risk_class: operational
    basis: >
      Cache is a synchronized HashMap keyed by JNDI name; env-entry getters bypass it.
    plain_text: >
      In the web application, once a shared service has been found it is remembered and reused; simple settings are looked up fresh each time.
    technical_note: >
      web/ServiceLocator uses Collections.synchronizedMap(new HashMap()); containsKey/get/put is not atomic, so concurrent first lookups may both hit JNDI (benign). Cache never invalidated, so a rebound resource is not seen.
    interface: false

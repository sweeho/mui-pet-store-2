  - record_key: CHECKOUT-BR-0001
    kind: business-rule
    capability_key: checkout-order-placement
    requirement: >
      GIVEN any lookup fails for any reason WHEN a resource is requested THEN the system SHALL raise a single ServiceLocatorException wrapping the cause.
    confidence: high
    confidence_basis: >
      Same wrapping pattern repeated in every method of both classes.
    risk_class: operational
    basis: Every getter catches NamingException and Exception and rethrows wrapped.
    plain_text: >
      Any failure to find a shared service is reported to the caller as one kind of error.
    technical_note: >
      Remote home lookups are narrowed with PortableRemoteObject.narrow. getBoolean unboxes the result; a null would NPE inside no try, but ClassCast/NamingException are wrapped.
    interface: false

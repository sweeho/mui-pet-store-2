  - record_key: CHECKOUT-REQ-0001
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL resolve named platform resources (EJB local and remote homes, JMS queues, topics and their connection factories, data sources) through a single lookup component rather than by each caller.
    confidence: medium
    confidence_basis: >
      One clear implementation per tier (web and ejb) with matching method sets; no tests or config seen, and no capability in the closed list fits infrastructure lookup.
    risk_class: operational
    basis: >
      Shared lookup utility used by the order flow; filed under the closest capability because no listed key covers cross-cutting infrastructure.
    plain_text: >
      The application finds its shared services (databases, message queues, business components) by name through one common helper.
    technical_note: >
      Two ServiceLocator classes (web and ejb packages) wrap javax.naming.InitialContext.lookup.

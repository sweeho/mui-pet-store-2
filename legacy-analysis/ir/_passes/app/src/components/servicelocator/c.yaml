  - record_key: CHECKOUT-REQ-0004
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      GIVEN the web locator fails to initialise at class load WHEN the failure occurs THEN the system SHALL print it to standard error and leave getInstance returning null.
    confidence: medium
    confidence_basis: One clear place in the static initialiser.
    risk_class: operational
    basis: Static block catches ServiceLocatorException and only prints.
    plain_text: >
      If the helper cannot start, the problem is only written to the error log and later use fails.
    technical_note: Callers get a NullPointerException on getInstance().x.
    interface: false
    traces:

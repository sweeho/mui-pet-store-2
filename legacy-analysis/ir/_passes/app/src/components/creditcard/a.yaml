      The three attributes are declared in the persistent bean descriptor, the bean class, the data holder class and the XML schema (four places).
    risk_class: regulated
    basis: Card number is stored as plain text alongside type and expiry date; no other attributes exist.
    plain_text: >
      A payment card consists of a card number, a card type and an expiry date.
    technical_note: >
      CMP 2.x entity CreditCardEJB with cmp-fields cardNumber, cardType, expiryDate; CreditCard is the value object; CreditCard.dtd defines the XML form.

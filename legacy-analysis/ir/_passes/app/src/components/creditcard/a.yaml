  - record_key: CHECKOUT-REQ-0002
    kind: requirement
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL exchange payment card data in XML documents containing CardNumber, CardType and ExpiryDate elements, in that order.
    confidence: high
    confidence_basis: >
      DTD declares the element order and the toDOM serialiser writes the same order; two places.
    risk_class: regulated
    basis: The card is embedded in purchase order documents using this format.
    plain_text: >
      When card details are passed to other parts of the order process they are sent as a small structured document with number, type and expiry date.
    technical_note: >
      CreditCard.toDOM/fromDOM with CreditCard.dtd, public id "DTD CreditCard 1.1".
    interface: true
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 114
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CREDITCARD);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
            XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
            return root;
          }
    stack_metadata:
      framework: XML DOM serialisation
  - record_key: CHECKOUT-BR-0003
    kind: business-rule
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL treat the expiry date as text in the form month/year, returning the part before the slash as the expiry month and the part after it as the expiry year.
    confidence: medium
    confidence_basis: One clear place (the bean accessors); no validation or tests seen.
    risk_class: regulated
    basis: Expiry month and year are derived by splitting on the slash.
    plain_text: >
      A card's expiry is entered as month/year; the month is the part before the slash and the year the part after.
    technical_note: CreditCardEJB.getExpiryMonth and getExpiryYear use indexOf("/").
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
    stack_metadata:
      ejb.bean: CreditCardEJB

  - record_key: SHOP-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart item whose catalog lookup fails WHEN the cart is listed THEN the system SHALL omit that line, log the error, and continue with the remaining lines.
    confidence: medium
    confidence_basis: One catch block; whether the omission is intentional is not documented.
    risk_class: financial
    basis: CatalogException is caught and printed; the line is skipped and so excluded from subtotal.
    plain_text: If an item can no longer be found in the catalog, it silently drops out of the cart view and the total.
    technical_note: Caught exception prints to stdout only; the item remains in the underlying map.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
        excerpt: |
          } catch (CatalogException cce) {
              System.out.println("ShoppingCartEJB caught: " + cce);
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB

      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL report the cart item count as the number of distinct items, not the sum of quantities.
    confidence: medium

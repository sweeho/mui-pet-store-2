records:
  - record_key: SHOP-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL hold, per shopper session, a cart mapping item identifiers to quantities, starting empty.
    confidence: high
    confidence_basis: Stateful bean declaration in the deployment descriptor plus constructor and ejbCreate both initialising an empty map.
    risk_class: operational
    basis: Cart is a HashMap of itemId to Integer quantity inside a stateful session bean.
    plain_text: Each shopper has their own cart that begins empty and remembers which items and how many of each.
    technical_note: ShoppingCartLocalEJB (stateful, container transactions) holds HashMap cart; state lives only in the session bean.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
          private HashMap cart;
          // default to the US English
          private Locale locale = Locale.US;

          public ShoppingCartLocalEJB() {
              cart = new HashMap();
          }
      - path: legacy-source/app/src/components/cart/src/ejb-jar.xml
        line_start: 49
        line_end: 54
        excerpt: |
          <ejb-name>ShoppingCartEJB</ejb-name>
          <session-type>Stateful</session-type>
          <transaction-type>Container</transaction-type>
    stack_metadata:
      framework: EJB
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required
      session.scope: stateful
  - record_key: SHOP-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL add an item to the cart with quantity 1 when no quantity is given, or with the stated quantity otherwise.
    confidence: medium
    confidence_basis: One clear place; no test or document describes it beyond the user guide's Add to Cart step.
    risk_class: operational
    basis: addItem overloads put quantity 1 or the supplied qty.
    plain_text: Adding an item puts one of it in the cart unless a quantity is given.
    technical_note: addItem(id) and addItem(id, qty) use cart.put, so adding an item already present replaces its quantity rather than adding to it, and qty is not validated (zero or negative is stored).
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 48
        line_end: 48
        excerpt: |
          2. Click Add to Cart in the row of the Male Adult Bulldog.
    stack_metadata:
      framework: EJB
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN an item already in the cart WHEN it is added again THEN the system SHALL set the item's quantity to the newly supplied value (default 1), not increase it.
    confidence: medium
    confidence_basis: Behaviour read from one place (put on a map); intent unconfirmed, may be a latent defect.
    risk_class: operational
    basis: HashMap.put overwrites existing key.
    plain_text: Adding an item that is already in the cart resets its quantity to the new amount instead of adding to it.
    technical_note: cart.put overwrites; the web tier may check for existence before calling, which is outside this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          cart.put(itemID, new Integer(1));
          cart.put(itemID, new Integer(qty));
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: The system SHALL set an item's quantity to the new value when it is updated, and SHALL remove the item from the cart when the new quantity is zero or less.
    confidence: medium
    confidence_basis: Single clear implementation with an explanatory comment.
    risk_class: operational
    basis: updateItemQuantity removes then re-adds only when newQty > 0.
    plain_text: Changing a quantity to zero or below takes the item out of the cart.
    technical_note: updateItemQuantity on an item not in the cart and with positive quantity adds it.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL allow an item to be removed from the cart and the whole cart to be emptied.
    confidence: medium
    confidence_basis: One clear place, simple methods.
    risk_class: operational
    basis: deleteItem removes a key; empty clears the map.
    plain_text: Shoppers can remove a single item or empty the entire cart.
    technical_note: deleteItem and empty on the session bean; removing an absent item is silently a no-op.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |

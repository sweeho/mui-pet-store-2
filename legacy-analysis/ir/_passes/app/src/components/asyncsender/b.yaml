records:
  - record_key: CUSTNOTIF-INT-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL accept a text message and place it as a single text message on a configured
      asynchronous queue, so that the message is delivered later by a separate consumer.
    confidence: high
    confidence_basis: >
      The send logic is in the bean class and the queue and connection factory resources are declared
      in the deployment descriptor (code plus config). The consumer and the message content are not in
      this module, so which e-mail it feeds is inferred from the capability, not read.
    risk_class: operational
    basis: >
      sendAMessage opens a queue connection, creates a sender on the AsyncSender queue, wraps the string
      in a text message and sends it.
    plain_text: >
      When another part of the shop wants something sent in the background, such as a customer e-mail,
      it hands the text to this service, which queues it for later delivery.
    technical_note: >
      Stateless session bean AsyncSenderEJB.sendAMessage(String). Looks up jms/QueueConnectionFactory and
      jms/AsyncSenderQueue through ServiceLocator in ejbCreate. Fits customer-notifications as the
      closest capability; the module itself does not name e-mail.
    interface: true
    traces:
      - path: legacy-source/app/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |

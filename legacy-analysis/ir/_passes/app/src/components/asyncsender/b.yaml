suspected_defects:
  - capability_key: customer-notifications
    record_keys: [CUSTNOTIF-REQ-0002]
    severity: low
    category: error-swallowed
    title: Failure to close the queue connection is ignored
    description: >
      The close in the finally block catches and discards any exception; the stack trace of a send
      failure goes to standard error rather than a log. The error text also refers to an MDB, which
      this is not.
    traces:
      - path: legacy-source/app/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 88

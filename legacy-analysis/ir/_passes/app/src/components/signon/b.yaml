  - record_key: CUST-REQ-0004
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      WHEN the sign-on form includes the remember-username option the system SHALL set a cookie named bp_signon holding the user name, valid 2678400 seconds (31 days); otherwise the system SHALL expire any existing bp_signon cookie.
    confidence: medium
    confidence_basis: One clear place; the duration is a bare literal with no comment (the one-month note is inline).
    risk_class: presentational
    basis: Cookie is set before authentication is checked, so it is set even if the sign-on fails.
    plain_text: Visitors can ask the site to remember their user name for about a month; leaving the option unticked clears it.
    technical_note: Cookie created from the posted name before authenticate(); maxAge 2678400 / 0.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |

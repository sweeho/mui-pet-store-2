  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL hold a sign-on user identified by a unique user name with an associated password.
    confidence: medium
    confidence_basis: Declared in ejb-jar CMP fields; no DDL in this module.
    risk_class: regulated
    basis: CMP entity with fields userName (key) and password.
    plain_text: Each registered customer has a unique user name and a password.
    technical_note: Abstract schema User; finder findAllUsers.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/ejb-jar.xml
        line_start: 57
        line_end: 65
        excerpt: |
          <field-name>password</field-name> ... <field-name>userName</field-name> ... <primkey-field>userName</primkey-field>
    stack_metadata:
      ejb.bean: UserEJB
      db.object: User
suspected_defects:
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0002, CUST-ENT-0001]
    severity: high
    category: data-corruption
    title: Passwords stored and compared as plain text
    description: >
      matchPassword compares the raw supplied string to the stored value; no hashing is applied on create or authenticate.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 179
        line_end: 181
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0006]
    severity: high
    category: other
    title: Create-user servlet logs the password to standard output
    description: >
      CreateUserServlet prints the user name and a password line to System.out on every creation.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 68
        line_end: 69
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0004]
    severity: low
    category: other
    title: Remember-me cookie set even when sign-on fails
    description: >
      The cookie is written before authentication is evaluated, so a failed attempt still stores the entered name.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 190
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0003]
    severity: low
    category: other
    title: Direct sign-on with no remembered URL redirects to null
    description: >
      ORIGINAL_URL is only set when a protected page is hit; a direct post to the sign-on check redirects to a null target.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 203
        line_end: 204
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
    description: >
      Lines 66-70 are partly unreadable in this reading (content redacted), so the exact create call and success redirect target could not be confirmed. Session timeout is not set in this module. Maximum password length value not visible.

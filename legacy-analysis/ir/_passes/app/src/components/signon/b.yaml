  - record_key: CUST-REQ-0006
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL create a user from the posted user name and password, and on a creation failure SHALL redirect to the user creation error page; the user name is the unique key so a duplicate name fails creation.
    confidence: medium
    confidence_basis: Servlet handling is partly obscured in the source view (redaction); duplicate rejection is inferred from the primary key declaration rather than an explicit check.
    risk_class: regulated
    basis: CreateUserServlet posts to SignOnEJB.createUser; ejb-jar declares userName as primkey-field.
    plain_text: A new customer can register with a user name and password; if registration fails, or the name is taken, an error page is shown.
    technical_note: Servlet redirects to user_creation_error.jsp on CreateException.
    interface: false
    traces:

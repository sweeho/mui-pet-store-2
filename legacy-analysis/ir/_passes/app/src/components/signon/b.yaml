records:
  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL intercept a request for a configured protected resource when the session is not signed on, remember the requested URL, and show the sign-on page instead.
    confidence: medium
    confidence_basis: One clear place (SignOnFilter.doFilter); the protected list comes from a config file not in this module, so which pages are protected is not visible.
    risk_class: regulated
    basis: Filter compares the target URL (after context root) to each protected pattern by exact equality.
    plain_text: Pages that require an account send an anonymous visitor to the sign-in page, and after sign-in the visitor goes on to the page they asked for.
    technical_note: SignOnFilter reads /WEB-INF/signon-config.xml via SignOnDAO; exact string match only (no wildcard); stores j_signon_original_url in session.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 152
        excerpt: |
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
          if (urlPattern.equals(targetURL)) {
              hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
              config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
    stack_metadata:
      framework: servlet-filter
      session.scope: session
  - record_key: CUST-REQ-0002
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL authenticate a sign-on request by looking up the user by name and comparing the supplied password with the stored one; an unknown user or a mismatch SHALL fail authentication.
    confidence: high
    confidence_basis: Enforced in the filter, session bean and entity bean (code in 3 places), plus the user guide describes sign-in.
    risk_class: regulated
    basis: SignOnEJB.authenticate returns false on FinderException; UserEJB.matchPassword uses String.equals on the stored value.
    plain_text: A visitor signs in with a user name and password; wrong or unknown credentials are refused.
    technical_note: Password is stored and compared in clear text (see suspected defect). SignOnEJB stateless session bean; UserEJB CMP entity keyed by userName.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78

    stack_metadata:
      framework: servlet-filter
  - record_key: CUST-REQ-0005
    kind: business-rule
    capability_key: customer-accounts
    requirement: >
      The system SHALL reject creation of a user whose user ID is longer than 25 characters, whose password exceeds the maximum password length, or whose user ID contains '%' or '*'.
    confidence: medium
    confidence_basis: Checked in UserEJB.ejbCreate with named constants; the password limit value was redacted in the source view so is not stated here.
    risk_class: operational
    basis: CreateException thrown for each violation. User ID length limit 25 from UserLocal.MAX_USERID_LENGTH.
    plain_text: A user name may be at most 25 characters and may not contain the characters % or *; passwords have a maximum length too.
    technical_note: Wildcards are excluded presumably because of EJB-QL/LIKE finders. Null name/password would raise NullPointerException, not CreateException.
    interface: false
    traces:

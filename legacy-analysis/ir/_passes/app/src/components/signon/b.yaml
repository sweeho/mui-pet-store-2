  - record_key: CUST-REQ-0003
    kind: workflow
    capability_key: customer-accounts
    requirement: >
      GIVEN authentication succeeds WHEN sign-on is processed THEN the system SHALL record the user name and a signed-on flag in the session and redirect to the originally requested URL; GIVEN it fails THEN the system SHALL redirect to the configured sign-on error page.
    confidence: medium
    confidence_basis: One clear place; error page value comes from config not visible here.
    risk_class: regulated
    basis: validateSignOn sets j_signon_username and j_signon=true, then redirects.
    plain_text: After a successful sign-in the visitor returns to the page they wanted; after a failed one they see an error page.
    technical_note: If no original URL is in the session (sign-in posted directly) sendRedirect(null) is invoked (see suspected defect). Signed-on state is a session attribute, no explicit timeout set here.
    interface: false
    traces:

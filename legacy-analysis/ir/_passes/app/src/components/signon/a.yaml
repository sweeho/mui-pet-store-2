  - record_key: CUSTOMER-ACCOUNTS-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL hold a sign-on user as a unique user name (primary key) and a password.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml (cmp fields, primkey) and used by UserEJB accessors.
    risk_class: regulated
    basis: CMP entity with userName primary key and password field.
    plain_text: >
      Each sign-on account has a unique user name and a password.
    technical_note: >
      UserEJB CMP entity, abstract schema User, primkey-field userName.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/ejb-jar.xml
        line_start: 56
        line_end: 65
        excerpt: |
          <abstract-schema-name>User</abstract-schema-name>
          <cmp-field>
          <cmp-field>
          <primkey-field>userName</primkey-field>
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: UserEJB
      db.object: User

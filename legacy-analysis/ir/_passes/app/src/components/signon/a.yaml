    path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserLocal.java
    description: >
      MAX_PASSWD_LENGTH value and the CreateUserServlet success-redirect line were not readable in the source as presented (redacted); the values need to be confirmed by a human. Session timeout (web.xml, 15 min in petstore app) belongs to another module and was not recorded here.

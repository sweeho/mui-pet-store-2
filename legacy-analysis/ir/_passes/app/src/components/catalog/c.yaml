suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0004]
    severity: low
    category: contradicts-document
    title: Search keywords are not lower-cased
    description: >
      Columns are compared with lower(...) but the keyword is only wrapped in %, so a query typed
      with capitals (e.g. "Bulldog") may not match, while the guide says search is not case-sensitive.
      Callers may lower-case the query before calling; that was not checked in this module.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 361
        line_end: 365
        excerpt: |
          for (int i = 0; i < keywords.length; i++) {
            parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1 section 2.2 Browsing and searching
        excerpt: Search is not case-sensitive.

  - record_key: SUPFUL-RULE-0005
    kind: business-rule
    capability_key: supplier-fulfillment
    requirement: The system SHALL describe each line item with category id, product id, item id, line number, quantity and unit price, and under XSD validation SHALL require all six, line number non-negative, quantity a positive integer and unit price a decimal of at least 0.
    confidence: high
    confidence_basis: Enforced by XSD, DTD (element order) and the builder utility, three places.
    risk_class: financial
    interface: true
    basis: TPALineItem.xsd attribute types; TPALineItemUtils writes the same six attributes.
    plain_text: Every item in a supplier order or invoice has product identifiers, a line number, a quantity of at least one and a price of zero or more.
    technical_note: XSD type is named positiveDecimal but minInclusive is 0.0, so zero is allowed. Quantity written as Long.toString, price as Float.toString.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 11
        line_end: 23
        excerpt: |
          <xsd:attribute name="quantity" type="xsd:positiveInteger" use="required" />
          <xsd:attribute name="unitPrice" type="positiveDecimal" use="required" />
          <xsd:minInclusive value="0.0" />
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 67
        line_end: 74
        excerpt: |
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
    stack_metadata:
      framework: DOM/JAXP
suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDAPP-RULE-0002]
    severity: medium
    category: error-swallowed
    title: Schema validation errors are logged but do not reject the document
    description: >
      The parser error handler's error() and warning() callbacks only print to stderr; only fatalError throws. A document that violates the DTD (non-fatal validity error) is therefore still accepted, despite validation being switched on.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 525
        line_end: 528
        excerpt: |
          public void error(SAXParseException exception) {
                        System.err.println("[Error]: " + exception.getMessage());
                        return;
  - capability_key: supplier-fulfillment
    record_keys: [SUPFUL-RULE-0005]
    severity: medium
    category: inconsistent-rounding
    title: Unit price carried as binary float in documents
    description: >
      Unit prices are accepted as float and written with Float.toString, which can produce values such as 9.989999 for a money amount, while the schema treats it as an exact decimal.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 74
        line_end: 74
        excerpt: |
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
    description: >
      Older non-namespaced SupplierOrder/Invoice/LineItem/Mail DTDs coexist with the TPA* versions; no caller inside this module uses them. Whether any consumer still depends on them needs a human or caller analysis.

    capability_key: supplier-fulfillment
    requirement: The system SHALL return shipment results from the supplier as an Invoice XML document carrying order id, user id, order date, shipping date (yyyy-MM-dd) and one or more line items.
    confidence: high
    confidence_basis: DTD, XSD and TPAInvoiceXDE agree; document trace corroborates the invoice flow.
    risk_class: financial
    interface: true
    basis: TPAInvoiceXDE fields and Invoice.dtd root content model.
    plain_text: When the supplier ships goods it sends back an invoice naming the order, customer, order and shipping dates and the items shipped.
    technical_note: TPAInvoiceXDE (namespace TPAInvoice, prefix tpai). Invoice.dtd also has locale attribute default en_US, not written by TPAInvoiceXDE. Delivered via jms/opc/InvoiceTopic per runbook.
    traces:

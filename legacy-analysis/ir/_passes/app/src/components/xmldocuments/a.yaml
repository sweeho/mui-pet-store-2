records:
  - record_key: ORDAPP-INT-0001
    kind: integration
    capability_key: order-approval
    requirement: The system SHALL exchange order approval/denial results as an OrderApproval XML document containing one or more Order entries, each with an OrderId and an OrderStatus.
    confidence: high
    confidence_basis: DTD and the Java serializer/deserializer both define the same structure; no test or caller seen in this module, so not graded on usage.
    risk_class: operational
    interface: true
    basis: OrderApproval.dtd declares OrderApproval (Order+), Order (OrderId, OrderStatus); ChangedOrder.toDOM/fromDOM emit and require the same two children in order.
    plain_text: Changes to order status are passed between systems as a message listing each order number with its new status; at least one order must be present.
    technical_note: OrderApproval.java and ChangedOrder.java build/parse DOM; DTD public id "DTD Order Approval 1.0". OrderStatus is free text in the DTD (no enumeration). FIXME in the DTD says OrderId should be an attribute.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 36
        line_end: 40
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!-- FIXME should be attribute -->
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 74
        line_end: 77
        excerpt: |
          Element root = document.createElement(XML_ORDER);
          XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
          XMLDocumentUtils.appendChild(document, root, XML_ORDERSTATUS, orderStatus);
    stack_metadata:
      framework: DOM/JAXP
      db.object: n/a
  - record_key: ORDAPP-RULE-0002
    kind: business-rule
    capability_key: order-approval
    requirement: GIVEN an incoming OrderApproval document WHEN it is parsed THEN the system SHALL validate it against the OrderApproval schema by default and SHALL reject documents whose root is not OrderApproval or whose Order lacks OrderId followed by OrderStatus.
    confidence: medium
    confidence_basis: Single class enforces it (fromDOM plus VALIDATING=true); validation is however only advisory, see defect.
    risk_class: operational
    interface: true
    basis: fromXML defaults validating to true; fromDOM throws if element names are not as expected.
    plain_text: An incoming order status message is checked for correct structure and refused if the structure is wrong.
    technical_note: OrderApproval.VALIDATING=true; XMLDocumentUtils.fromXML builds a validating DocumentBuilder; fromDOM throws XMLDocumentException "OrderApproval element expected."
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 69
        line_end: 69
        excerpt: |
          public static final boolean VALIDATING = true;
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 160
        line_end: 164
        excerpt: |
          throw new XMLDocumentException(XML_ORDERAPPROVAL + " element expected.");
    stack_metadata:
      framework: DOM/JAXP

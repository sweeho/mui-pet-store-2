  - record_key: SUPFUL-ENT-0005
    kind: entity
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL represent an invoice sent back to the order system as an order id, user id, order date, shipping date and one or more line items, with a locale defaulting to en_US in the legacy form.
    confidence: high
    confidence_basis: >
      Legacy DTD, TPA builder and TPA XSD all list the same fields.
    risk_class: financial
    basis: >
      Invoice.dtd; TPAInvoiceXDE.copyDocument appends OrderId, UserId, OrderDate, ShippingDate, LineItems; TPAInvoice.xsd types dates as xsd:date.
    plain_text: >
      When a supplier ships, an invoice goes back to the store showing the order, the customer, when it was ordered and shipped, and what was sent.
    technical_note: >
      The TPA builder has no locale attribute; the legacy DTD does.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 41
        line_end: 44
        excerpt: |
          <!ELEMENT Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItem+)>

          <!ATTLIST Invoice
          	locale CDATA "en_US"
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 116
        line_end: 120
        excerpt: |
          invoiceElement.appendChild(orderIdElement);
          invoiceElement.appendChild(userIdElement);
          invoiceElement.appendChild(orderDateElement);
          invoiceElement.appendChild(shippingDateElement);
          invoiceElement.appendChild(lineItemsElement);
    stack_metadata:
      framework: JAXP DOM
  - record_key: SUPFUL-ENT-0006
    kind: entity
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL represent each line item with category id, product id, item id, line number, quantity and unit price.
    confidence: high
    confidence_basis: >
      DTD and TPA line-item builder agree on the six fields.
    risk_class: financial
    basis: >
      LineItem.dtd and TPALineItemUtils.addLineItem.
    plain_text: >
      Every item line in an order or invoice names the category, product and item, its line number, how many, and the price per unit.
    technical_note: >
      TPA form writes these as namespaced attributes (categoryId, productId, itemId, lineNo, quantity, unitPrice); the legacy DTD uses child elements.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 69
        line_end: 74
        excerpt: |
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_CATEGORYID, categoryId);
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_PRODUCTID, productId);
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_ITEMID, itemId);
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_LINENO, lineNo);
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
    stack_metadata:
      framework: JAXP DOM

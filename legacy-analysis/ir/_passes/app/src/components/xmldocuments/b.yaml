  - record_key: SUPFUL-REQ-0008
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL refuse to build a supplier-order or invoice element with a null value, and SHALL serialise dates as yyyy-MM-dd.
    confidence: medium
    confidence_basis: >
      Null guard and date format are each one clear place per builder, repeated identically in two builders.
    risk_class: operational
    basis: >
      XMLDocumentUtils.createElement throws IllegalArgumentException for a null value; both XDEs format dates with SimpleDateFormat yyyy-MM-dd.
    plain_text: >
      Order and invoice messages cannot be created with a missing field, and dates are written year-month-day.
    technical_note: >
      Unit price is passed as a float and written with Float.toString.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 280
        line_end: 280
        excerpt: |
          throw new IllegalArgumentException("XMLDocumentUtils.createElement: value of " + name + " element can't be null.");
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 70
        line_end: 70
        excerpt: |
          private final SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
    stack_metadata:
      framework: JAXP DOM
  - record_key: SUPFUL-REQ-0009
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL allow supplier documents to be produced and checked against either a DTD or an XSD, chosen per builder instance, resolving the schema location through an optional entity catalog and falling back to built-in schema locations.
    confidence: medium
    confidence_basis: >
      One clear mechanism in constructor code; which mode production callers use is outside this module.
    risk_class: operational
    basis: >
      TPAInvoiceXDE and TPASupplierOrderXDE constructors take (entityCatalogURL, xsdValidation) and default to DTD with no catalog.
    plain_text: >
      Order and invoice messages follow an agreed format, and which format version is used can be configured.
    technical_note: >
      Constructor resolves system id via CustomEntityResolver.mapEntityURI else a classpath constant. In XSD mode no DOCTYPE is written (serialize).
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 87
        line_end: 97
        excerpt: |
          public TPAInvoiceXDE(URL entityCatalogURL, boolean xsdValidation) throws XMLDocumentException {
            setEntityCatalogURL(entityCatalogURL);
            setSupportingXSD(xsdValidation);
            ...
              this.systemId = (systemId != null) ? systemId : (isSupportingXSD() ? XSD_SYSTEM_ID : DTD_SYSTEM_ID);
    stack_metadata:
      framework: JAXP
  - record_key: SUPFUL-REQ-0010
    kind: requirement
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL select a document editor class by mapping a schema URI through a catalog and SHALL fail with an error when no mapping exists or the class cannot be instantiated.
    confidence: medium
    confidence_basis: >
      One clear place; the catalog contents live outside this module.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory.getXDE.
    plain_text: >
      Each type of business document is handled by the component registered for it; an unregistered document type is rejected.
    technical_note: >
      Properties lookup then Class.forName(...).newInstance().
    interface: false
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 60
        line_end: 66
        excerpt: |
          public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
            String className = xdeCatalog.getProperty(schemaURI);
            if (className != null) {
              return createXDE(className);
            }
            throw new XMLDocumentException("No mapping for schema: " + schemaURI);
    stack_metadata:
      framework: factory
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
    description: >
      Two generations of schemas exist (legacy DTDs in rsrc/schemas, TPA DTD/XSD in the package); the entity catalog points at PurchaseOrder/SupplierOrder 1.1 in other components. Which are live cannot be told from this module. No supporting document in legacy-analysis/sources covers this module.
suspected_defects:
  - capability_key: supplier-fulfillment
    record_keys: [SUPFUL-ENT-0004]
    severity: low
    category: other
    title: Supplier order DTD names line item element in lower case but imports a DTD defining LineItem
    description: >
      SupplierOrder.dtd requires lineitem+ while the imported LineItem.dtd declares LineItem; XML names are case sensitive so lineitem is never declared and the content model cannot be satisfied by a valid document.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 38
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 38
  - capability_key: supplier-fulfillment
    record_keys: [SUPFUL-ENT-0006]
    severity: medium
    category: inconsistent-rounding
    title: Unit price carried as a binary float
    description: >
      Unit price is passed as float and written with Float.toString, which can lose precision for monetary amounts.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 66
        line_end: 74
  - capability_key: order-approval
    record_keys: [ORDAPP-REQ-0002]
    severity: low
    category: error-swallowed
    title: Parse failure is only printed to stderr before being rethrown
    description: >
      fromXML(String) prints the root cause to standard error and rethrows wrapped; XMLDocumentUtils.serialize also prints and rethrows. Diagnostics go outside any logging facility.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 134
        line_end: 137

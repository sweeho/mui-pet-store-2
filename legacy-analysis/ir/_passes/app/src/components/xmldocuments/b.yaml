records:
  - record_key: ORDAPP-ENT-0001
    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL represent an order-approval message as a list of one or more orders, each carrying an order id and an order status.
    confidence: high
    confidence_basis: >
      The shape is stated in the DTD and mirrored by the Java model and its DOM (de)serialisation; two places agree.
    risk_class: operational
    basis: >
      OrderApproval.dtd declares OrderApproval as Order+ and Order as (OrderId, OrderStatus); ChangedOrder holds the two strings and OrderApproval holds the list.
    plain_text: >
      A batch of order status changes is exchanged as a list of at least one order, each with an order number and its new status.
    technical_note: >
      OrderApproval.java and ChangedOrder.java build and parse the DOM. The DTD has a FIXME that OrderStatus should be an attribute.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 40
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>

          <!ELEMENT Order (OrderId, OrderStatus)>
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 73
        line_end: 77
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ORDER);
            XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
            XMLDocumentUtils.appendChild(document, root, XML_ORDERSTATUS, orderStatus);
            return root;
    stack_metadata:
      framework: JAXP DOM
      db.object: n/a
  - record_key: ORDAPP-REQ-0002
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL validate an incoming order-approval document against its declared structure by default, and SHALL reject it with an error when the root element is not an order-approval list or a required child is missing.
    confidence: high
    confidence_basis: >
      Default validating flag and explicit root/child checks are both in code, plus the DTD.
    risk_class: operational
    basis: >
      fromXML overloads default to VALIDATING=true; fromDOM throws unless the root is OrderApproval; ChangedOrder.fromDOM requires OrderId then OrderStatus in sequence.
    plain_text: >
      An approval message that is malformed or has no order id or status is refused rather than partly processed.
    technical_note: >
      OrderApproval.fromXML(...) delegates to XMLDocumentUtils.fromXML with the DTD public id. Errors are wrapped in XMLDocumentException.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 69
        line_end: 69
        excerpt: |
          public static final boolean VALIDATING = true;
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 156
        line_end: 169
        excerpt: |
          public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
            ...
            throw new XMLDocumentException(XML_ORDERAPPROVAL + " element expected.");
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 85
        line_end: 86
        excerpt: |
          changedOrder.orderId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ORDERID, false), false);
          changedOrder.orderStatus = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ORDERSTATUS, false), false);
    stack_metadata:
      framework: JAXP DOM
  - record_key: CHKOUT-ENT-0003
    kind: entity
    capability_key: checkout-order-placement
    requirement: >
      The system SHALL represent a purchase order document with order id, user id, e-mail id, order date, shipping address, billing address, total price, credit card (number, expiry date, card type) and one or more line items, with a locale defaulting to en_US.
    confidence: medium
    confidence_basis: >
      Stated only in the DTD; this module has no Java reading it. Whether the DTD copy here is the live one is unclear because the entity catalog points at a newer 1.1 copy elsewhere.
    risk_class: financial
    basis: >
      PurchaseOrder.dtd content model and locale attribute default.
    plain_text: >
      A customer order sent for processing carries who ordered, contact e-mail, the ship-to and bill-to addresses, the total, the payment card details, and at least one item; the language defaults to US English.
    technical_note: >
      DTD only under rsrc/schemas. EntityCatalog.properties maps PurchaseOrder 1.1 to the purchaseorder component, so this copy may be superseded.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>

          <!ATTLIST PurchaseOrder
          	locale CDATA "en_US"
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 74
        line_end: 74
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, ExpiryDate, CardType)>
    stack_metadata:
      framework: DTD
  - record_key: SUPFUL-ENT-0004
    kind: entity
    capability_key: supplier-fulfillment
    requirement: >
      The system SHALL represent a supplier order as an order id, an order date, a shipping address (first name, last name, street, city, state, country, zip) and one or more line items.
    confidence: high
    confidence_basis: >
      Stated in the legacy DTD and, in the newer TPA form, in the builder class and XSD, which add e-mail and phone to the address.
    risk_class: operational
    basis: >
      SupplierOrder.dtd and TPASupplierOrderXDE.copyDocument/setShippingAddress. The two forms differ: the TPA builder also includes Email and Phone.
    plain_text: >
      An order sent to a supplier lists the order number, date, the delivery address with name and, in the newer format, e-mail and phone, and the items ordered.
    technical_note: >
      TPASupplierOrderXDE builds a namespaced document (tpaso) in element order OrderId, OrderDate, ShippingAddress, LineItems. Date format yyyy-MM-dd.
    interface: true
    traces:

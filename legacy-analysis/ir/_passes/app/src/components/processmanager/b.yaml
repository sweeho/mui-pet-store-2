  - record_key: ORDAPP-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: The system SHALL recognise the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: One clear place (constants). The Manager does not validate status values, so the set is conventional, not enforced here.
    risk_class: operational
    basis: Status name constants with comments (placed but not approved, approved, denied, partially completed, completed).
    plain_text: An order is pending, approved, denied, partly shipped or completed.
    technical_note: OrderStatusNames string constants; ProcessManagerEJB.updateStatus accepts any string without checking allowed transitions.

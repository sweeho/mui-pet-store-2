  - record_key: CUSTOMER-ACCOUNTS-BUSINESS-RULE-0004
    kind: business-rule
    capability_key: customer-accounts
    requirement: GIVEN an account is created without explicit contact or card details, WHEN creation completes, THEN the system SHALL attach a new empty contact-information record and a new empty credit-card record to the account.
    confidence: medium
    confidence_basis: One clear place (AccountEJB.ejbPostCreate); the created records belong to other modules.
    risk_class: operational
    basis: Post-create hook creates ContactInfo and CreditCard via JNDI.
    plain_text: A new account starts with blank contact details and a blank payment card, to be filled in later.
    technical_note: AccountEJB.ejbPostCreate(String status) creates via ejb/ContactInfo and ejb/CreditCard; the overload with explicit refs just attaches them.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 99
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
              setStatus(status);
              try {
                  InitialContext ic = new InitialContext();
                  ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                  ContactInfoLocal contactInfo = cih.create();
                  setContactInfo(contactInfo);
                  CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                  CreditCardLocal creditCard = cch.create();
                  setCreditCard(creditCard);
    stack_metadata:

  - record_key: CUSTOMER-ACCOUNTS-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: customer-accounts
    requirement: GIVEN a new customer is created, WHEN creation completes, THEN the system SHALL also create an account with status "active" and a profile with default preferences.
    confidence: high
    confidence_basis: Behaviour stated in the post-create hook plus constants in the home interfaces; two places.
    risk_class: operational
    basis: ejbPostCreate creates Account (Active) and Profile (defaults) and links them to the customer.
    plain_text: When someone signs up, an active account and a default profile are created for them automatically.
    technical_note: CustomerEJB.ejbPostCreate looks up ejb/Account and ejb/Profile via JNDI and creates them; a naming failure becomes CreateException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);

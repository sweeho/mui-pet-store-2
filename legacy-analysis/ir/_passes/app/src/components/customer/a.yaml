  - record_key: CUSTOMER-ACCOUNTS-BUSINESS-RULE-0007
    kind: business-rule
    capability_key: customer-accounts
    requirement: The system SHALL give each customer exactly one account and one profile, and each account exactly one contact-info and one credit-card record, and SHALL delete the dependent record when its owner is deleted.
    confidence: medium
    confidence_basis: Relationship multiplicity and cascade-delete are declared in the descriptor only; the cascade side assignment was read from the element order.
    risk_class: operational
    basis: ejb-relation entries with multiplicity One and cascade-delete.
    plain_text: Each customer has one account and one profile; removing the owner removes the attached details.
    technical_note: Four ejb-relation blocks (customer-account, customer-profile, account-contactInfo, account-creditCard) with cascade-delete on the dependent role.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/ejb-jar.xml
        line_start: 266
        line_end: 346
        excerpt: |
          <multiplicity>One</multiplicity>
          <cmr-field-name>account</cmr-field-name>
          <multiplicity>One</multiplicity>
          <cascade-delete />
          <cmr-field-name>profile</cmr-field-name>
    stack_metadata:
      ejb.bean: CustomerEJB

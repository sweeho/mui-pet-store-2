    confidence_basis: Defaults declared as constants and used by customer creation; two places.
    risk_class: presentational
    basis: ProfileLocalHome default constants passed in CustomerEJB.ejbPostCreate.
    plain_text: A new customer starts with US English, no favorite category, and the personal list and banner turned on.
    technical_note: ProfileEJB CMP fields preferredLanguage, favoriteCategory, myListPreference, bannerPreference. Locale default is en_US; localization capability overlaps.

records:
  - record_key: CUSTACC-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL identify each customer by a unique user id, and every customer SHALL own exactly one account and one profile.
    confidence: medium
    confidence_basis: Primary key and one-to-one relationship declared in ejb-jar.xml; no tests or second place enforcing it.
    risk_class: operational
    basis: CustomerEJB has userId as primary key field and CMR fields account and profile; the account relation has cascade-delete.
    plain_text: Every customer has a unique user name, one account and one set of profile preferences. Removing the customer removes the account.
    technical_note: CMP entity CustomerEJB (primkey userId) with CMR to AccountEJB and ProfileEJB; ejb-jar.xml relation with multiplicity One and cascade-delete on the account side. findAllCustomers finder via EJB-QL.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/ejb-jar.xml
        line_start: 56
        line_end: 61
        excerpt: |
          <abstract-schema-name>Customer</abstract-schema-name>
          <cmp-field>
          <field-name>userId</field-name>
          </cmp-field>
          <primkey-field>userId</primkey-field>
      - path: legacy-source/app/src/components/customer/src/ejb-jar.xml
        line_start: 276
        line_end: 281
        excerpt: |
          <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
          <multiplicity>One</multiplicity>
          <cascade-delete />
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CustomerEJB
  - record_key: CUSTACC-WF-0001
    kind: workflow
    capability_key: customer-accounts
    requirement: GIVEN a new customer is created WHEN creation completes THEN the system SHALL automatically create an account with status active, a blank contact info and a blank credit card, and a profile with default preferences.
    confidence: high
    confidence_basis: Seen in CustomerEJB.ejbPostCreate and AccountEJB.ejbPostCreate plus constants in the home interfaces; two places.
    risk_class: operational
    basis: ejbPostCreate creates Account(Active) and Profile(defaults); account postCreate creates empty ContactInfo and CreditCard.
    plain_text: When a customer signs up, an active account with empty contact and card details and a profile with default preferences is created automatically.
    technical_note: CustomerEJB.ejbPostCreate looks up Account and Profile homes via JNDI; a naming failure raises CreateException. AccountEJB.ejbPostCreate(status) creates ContactInfo and CreditCard.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 92
        excerpt: |

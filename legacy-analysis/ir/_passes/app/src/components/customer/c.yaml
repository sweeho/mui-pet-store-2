  - record_key: CUSTACC-ENT-0004
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL store for each account a contact info (given name, family name, telephone, e-mail, address) and a credit card (type, number, expiry date).
    confidence: medium
    confidence_basis: Declared fields in ejb-jar.xml only; no validation in this module.
    risk_class: regulated
    basis: CMP fields of ContactInfo, CreditCard and Address entities; card number is stored as a plain field.
    plain_text: Each account keeps the customer's name, phone, e-mail, address and payment card details.
    technical_note: ContactInfoEJB, CreditCardEJB, AddressEJB (zipCode, state, streetName1/2, country, city) declared in ejb-jar.xml; held by AccountEJB through CMR fields. Validation lives elsewhere (checkout).

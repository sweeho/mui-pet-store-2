suspected_defects:
  - capability_key: checkout-order-placement
    record_keys: [CHK-ENT-0001]
    severity: medium
    category: data-corruption
    title: Billing info returned as shipping info and only one contact stored
    description: >
      Only the shipping contact is persisted; when the order is read back, billing and shipping are both set to the stored contact (marked XXX), so a distinct billing address is lost.
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 267
        line_end: 268
        excerpt: |
          purchaseOrder.setBillingInfo(getContactInfo().getData());
          purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo()); // XXX
  - capability_key: checkout-order-placement
    record_keys: [CHK-ENT-0001]
    severity: low
    category: other
    title: Order total stored as a binary float
    description: Money is held as a float, which can introduce rounding error.
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 139
        line_end: 145
        excerpt: |
          public abstract float getPoValue();
          public abstract void setPoValue(float amount);

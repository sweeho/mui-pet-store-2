# CI for this project, created by Vortex from the Next.js, MUI and Modernize stack template.
#
# Pull requests and pushes to the integration branch and main run it; a push to an agent's
# ticket branch does not (Vortex reads the run on the ticket's pull request). Each test step
# writes a JUnit report under .vortex-results/, and the upload step publishes them as
# `vortex-test-results`, where Vortex reads the official result of each test case.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: ["vortex/**", dev, main]
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04, where Playwright 1.60 cannot install
    # Chromium. Move this with the Playwright pin. The runner image has the PostgreSQL server
    # programs, which the PostgreSQL option's tests start a throwaway cluster with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
      - name: Install dependencies
        run: npm ci
      - name: Versions agree with stack.versions.yaml
        run: node .vortex/check-versions.mjs
      - name: Doc links
        run: node scripts/check-doc-links.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit and integration tests
        run: JEST_JUNIT_OUTPUT_FILE=.vortex-results/unit.xml npm test -- --reporters=default --reporters=jest-junit
      - name: Build
        run: npm run build
      # The system packages come from the Ubuntu mirror; when it is unreachable the install
      # hangs. The image already has Chromium's libraries, so the browser is installed alone.
      - name: Install Playwright's Chromium
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: E2E tests
        run: npm run test:e2e -- --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: .vortex-results/e2e.xml
      # The locked acceptance suite is red until Build makes it pass, so these steps do not fail
      # the job. Remove continue-on-error once the suite is green.
      - name: Acceptance tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: JEST_JUNIT_OUTPUT_FILE=.vortex-results/acceptance/junit.xml npm run test:acceptance -- --reporters=default --reporters=jest-junit
      - name: Acceptance browser tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:acceptance:e2e
      - name: Upload test results for Vortex
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-test-results
          path: .vortex-results/*.xml
          # The reports live in a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload acceptance results for Vortex
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-test-results-acceptance
          path: .vortex-results/acceptance/
          include-hidden-files: true
          if-no-files-found: ignore

  # Replays a ticket's [tdd:red] and [tdd:green] commits on its pull request into a sprint
  # branch; Vortex's merge gate reads the vortex-tdd-replay artifact.
  tdd-verify:
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'vortex/sprint/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
      - run: npm ci
      - run: sh .vortex/tdd-verify.sh "${{ github.base_ref }}" "JEST_JUNIT_OUTPUT_FILE=.vortex-results/junit.xml npm test -- --reporters=default --reporters=jest-junit" ".vortex-results/junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-tdd-replay
          path: vortex-replay/

  # Proving tests: measure the built server and report each value to Vortex, which owns the
  # targets (the Architecture and requirements module). Never gating: the job is allowed to fail,
  # so a slow or broken measurement leaves the run green and reads as "not met" or "no evidence".
  # The database is not needed: the proving test calls a route that reads none.
  proving:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start the built server
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > proving-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/hello > /dev/null && exit 0; sleep 1; done
          cat proving-server.log; exit 1
      - name: Proving tests
        run: npm run test:proving -- --reporter=list,junit
        env:
          PROVING_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: .vortex-results/proving.xml
      - name: Upload proving results for Vortex
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vortex-test-results-proving
          path: .vortex-results/proving.xml
          include-hidden-files: true
          if-no-files-found: ignore

  # The production image builds. It is never pushed: publishing is your release process.
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t app:ci .

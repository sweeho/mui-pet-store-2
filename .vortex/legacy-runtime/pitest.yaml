# Mutation testing (FR-IM-56) for the legacy Java code.
#
# UNVERIFIED: this command has not been run. When this file was written:
#   - legacy-source/ was not on dev (only on vortex/legacy-spec/sx-0001),
#   - the legacy build is Ant (build.xml), with no pom.xml or Gradle build,
#   - the legacy tree has no test sources (nothing for PIT to mutate against),
#   - the workspace had no JDK, Maven, Gradle or Ant.
# The command assumes a Maven wrapper pom is added at legacy-source/pom.xml
# with pitest-maven configured. Re-run and replace the score below once the
# legacy source and its tests are on dev.
tool: pit
command: mvn -f legacy-source/pom.xml org.pitest:pitest-maven:mutationCoverage
targetClasses:
  - "com.sun.j2ee.blueprints.*"
targetTests:
  - "com.sun.j2ee.blueprints.*"
reportPath: legacy-source/target/pit-reports/mutations.xml
firstRun:
  executed: false
  mutationScore: null

<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--on-primary:#fff;--bg:#fff;--paper:#f8fafc;--text:#0f172a;--muted:#64748b;--divider:#e2e8f0;--r:4px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{display:flex;min-height:100vh}
.rail{width:240px;flex:0 0 240px;border-right:1px solid var(--divider);background:var(--bg);display:flex;flex-direction:column;padding:0 12px}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:16px}
.logo{width:28px;height:28px;border-radius:var(--r);background:var(--primary);color:#fff;display:grid;place-items:center}
.logo svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:16px 8px 4px;letter-spacing:.02em}
.ni{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);margin-bottom:2px}
.ni svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
.ni:hover{background:var(--paper)}
.ni.on{background:var(--primary);color:var(--on-primary);font-weight:500}.ni.on svg{stroke:#fff}
.railfoot{margin-top:auto;padding:12px 8px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--divider)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.top{height:64px;flex:none;background:var(--bg);border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0}
.search{flex:0 1 420px;height:36px;border:1px solid var(--divider);border-radius:var(--r);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);background:var(--bg)}
.search svg,.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.search input{border:0;outline:0;font:inherit;flex:1;color:var(--text);background:transparent}
.sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.pri{background:var(--primary);color:#fff}
.sec{background:var(--bg);border-color:var(--divider)}.sec:hover{background:var(--paper)}
.gh{background:transparent}.gh:hover{background:var(--paper)}
.ib{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--divider);background:var(--bg);display:grid;place-items:center}
.content{flex:1;padding:24px 32px 32px;max-width:1200px;width:100%}
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}.crumb a{color:var(--primary)}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px}
.ph h1{font-size:24px;font-weight:600;line-height:32px}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--divider);border-radius:var(--r)}
.row{display:flex;gap:16px;align-items:center;height:40px;border-top:1px solid var(--divider);padding:0 16px}
.sk{height:12px;background:linear-gradient(90deg,#eef2f6 0,#f8fafc 50%,#eef2f6 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:14px;height:14px;border:2px solid var(--divider);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.foot{border-top:1px solid var(--divider);background:var(--bg);padding:16px 32px;display:flex;gap:24px;font-size:12px;color:var(--muted)}

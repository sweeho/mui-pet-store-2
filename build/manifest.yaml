  - slug: batch-operations
    title: "Batch operations and reporting"
    order: 10
    dependsOn: [checkout-order-placement, order-approval, supplier-fulfillment]
    priority: 0
    change:
      dir: openspec/changes/sx-batch-operations
      specCapabilities:
        - batch-operations
    canvas:
      problem: "Operations rely on nightly and weekly jobs for backup, Finance extract, reporting, integrity checks and purge."
      solution: "Build the batch chain: nightly backup, Finance order extract for D-1, aging and low-stock reports, catalog check, weekly purge after extract, shared logging, exit codes and failure notification."
      userStories:
        - "As Finance, I want a nightly order extract, so that I can reconcile sales."
        - "As an operator, I want reports on stuck orders and low stock, so that I can intervene."
      acceptanceCriteria:
        - "Nightly Finance extract — Nightly run: orders of day D-1 are written to the dated file in the specified layout"
        - "Purge of finished orders — Sunday run: finished orders are purged after the extract"
        - "Nightly chain ordering — Chain runs: jobs run in the specified order"
        - "Job logging and exit codes — Job fails: nonzero exit and logged"
        - "Daily low-stock report — Daily run: low-stock items are reported"
      outOfScope:
        - "Interactive administration (order-administration)"
      risksAssumptions: []
      techStack: []
      affectedCode: []

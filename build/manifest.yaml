  - slug: customer-notifications
    title: "Customer notifications"
    order: 8
    dependsOn: [order-approval]
    priority: 0
    change:
      dir: openspec/changes/sx-customer-notifications
      specCapabilities:
        - customer-notifications
    canvas:
      problem: "Customers must learn the outcome and progress of their orders by e-mail."
      solution: "Build queue-based HTML order-status mail: approval or denial, shipment, completion, with switches, locale-specific subjects and bodies and defined failure handling."
      userStories:
        - "As a customer, I want an e-mail when my order is approved, denied, shipped or completed, so that I know its status."
      acceptanceCriteria:
        - "Order-status mail enablement — Mail switch off: no mail is sent"
        - "Shipped mail switches off by default — Default configuration: shipped mail is not sent"
        - "HTML mail delivery — Mail sent: delivered as HTML"
        - "Undeliverable mail discarded — Delivery fails: mail is discarded"
        - "Malformed message rollback — Malformed queue message: consumption is rolled back"
      outOfScope:
        - "Localizing mail body (the mailer itself does not localize)"
        - "Other channels such as SMS"
      risksAssumptions: []
      techStack: []
      affectedCode: []

  - slug: order-administration
    title: "Order administration"
    order: 9
    dependsOn: [order-approval]
    priority: 0
    change:
      dir: openspec/changes/sx-order-administration
      specCapabilities:
        - order-administration
    canvas:
      problem: "Administrators need to see orders by status, decide on them and view sales charts."
      solution: "Build the administrator-only management client: sign-on with session expiry, order list by status, batch decisions and sales charts, with the XML message contract to the order processing server."
      userStories:
        - "As an administrator, I want to list orders by status, so that I can find those to act on."
        - "As an administrator, I want sales charts, so that I can follow sales."
      acceptanceCriteria:
        - "Administrator-only access — Non-administrator: access refused"
        - "Admin session expiry — Inactive session: it expires"
        - "Orders listing by status for administrators — Status chosen: orders with id, user, date, value and status are listed"
        - "Sales charts — Charts requested: sales are aggregated and drawn"
        - "Client XML message contract — Client request: it follows the specified XML contract"
      outOfScope:
        - "Approval rules themselves (order-approval)"
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Order list by status: lists orders of a chosen status, showing for each the order id, user id, order date (month/day/year), order value and status (ORD-APPR-REQ-0010)"
